oaap_manifest: "0.18"

app:
  id: mcp-gateway
  name: MCP-Gateway
  version: 0.44.0
  type: native
  class: frontend
  description: "Die Tür für KI-Werkzeuge: MCP-Server hinter einem Endpunkt je Sicht. Werkzeuge, Ressourcen und Prompts mehrerer Server einzeln freigeben, mit festgehaltenem Text, festen Argumenten, Grenzen und Wirkungsklassen; hinein mit API-Schlüssel, Anmeldung am Anmeldedienst des Mandanten oder als Person aus einem Chat der Plattform; Ampel je Server, Schutz der Server, Verbrauchsmessung ohne Argumente und Ergebnisse. Meine Werkzeuge zeigt jeder Person ihre eigenen Aufrufe und nimmt ihren persönlichen Zugang zu einem Server an; die Assistenten der Chats liegen hier mit Revisionen."

mcp_sources:
  # RFC-0073 Stufe 1 (Manifest 0.11): die Plattform nennt die MCP-Apps des
  # eigenen Mandanten auf diesem Knoten; das Gateway traegt sie als Server ein,
  # in einer Sicht erscheint nichts ohne Freigabe.
  read: true

care:
  # RFC-0071 §15 (Manifest 0.10): Nur Standardbibliothek, beim Bau wird nichts nachgeladen — ein Neubau ändert nur die Basis.
  rebuild: self

services:
  web:
    build: .
    port: 8000

routes:
  # Zwei Wege in dieselbe App. Der längere Pfad gewinnt.
  #
  # /mcp ist `public`: Die Plattform authentifiziert hier NICHTS, entfernt
  # gefälschte Identitäts-Kopfzeilen und bremst je Client-Adresse
  # (RFC-0010). Geprüft wird im Dienst: Der API-Schlüssel IST die
  # Identität und nennt die Sichten, die er benutzen darf (Spec §2).
  - path: /mcp
    roles: [public]
  # Wo ein MCP-Client erfährt, bei welchem Anmeldedienst er sich anmeldet
  # (RFC 9728). Öffentlich wie /mcp, für jede Sicht gleich (Spec §2.2).
  - path: /.well-known/oauth-protected-resource
    roles: [public]
  # Die Seite der Person (RFC-0095, D10): ihre eigenen Aufrufe, im Portal
  # „Meine Werkzeuge“. Die Plattform setzt X-OAAP-User-Id; das Gateway zeigt
  # nur Messzeilen genau dieser Kennung.
  - path: /me
    roles: [user, keyuser, admin]
  # Die Betreiber-Sicht: Server, Katalog, Sichten, Schlüssel, Verbrauch,
  # Auswertung, /report/v1/… für ein Abrechnungssystem. Ausdrücklich
  # `admin`: Wer hier freigibt, öffnet Systeme für KI-Agenten.
  - path: /
    roles: [admin]

# 0.27.0 (RFC-0104 Stufe 2, Manifest 0.18): die Einrichtungstuer. Sie liegt unter der
# Route `/` (admin) -- von aussen kommt niemand ohne diese Rolle hin, und auch mit ihr
# nicht ohne OAAP_SETUP_KEY: Die App achtet auf diesem Pfad auf keine
# Identitaets-Kopfzeile. Der Knoten ruft sie ueber den internen Listener.
setup:
  path: /oaap/setup

storage:
  # Schlüssel (nur als SHA-256), Server, Katalog, freigegebene Einträge,
  # Messzeilen, Prüfspur. KEINE Argumente, KEINE Ergebnisse: Es gibt keine
  # Spalte, in die sie passen würden (Spec §10).
  - name: data
    mount: /data

# 0.22.0 (RFC-0097 Stufe 1, D9): die Assistenten gehoeren dem Gateway. Wer einen
# Team-Assistenten sieht (use) und pflegt (manage), sagen die fachlichen
# Berechtigungen (RFC-0045) -- dieselben Vorlagen wie bisher im Chat, nun fuer
# diese App. Private legt jede Person fuer sich an, solche fuer den ganzen
# Mandanten nur tenant_admin.
authorization:
  objects:
    - key: assistant
      title: Assistent
      activities: [use, manage]
      fields:
        - key: team
          context: Team
  role_templates:
    - key: assistant_user
      title: Assistenten des Teams benutzen
      grants:
        - object: assistant
          activities: [use]
          team: $context
    - key: assistant_keyuser
      title: Assistenten des Teams pflegen
      grants:
        - object: assistant
          activities: [use, manage]
          team: $context

config:
  # Der Schlüssel zum Tresor für Zugangsdaten der Server. Kommt bewusst
  # aus einer ANDEREN Quelle als /data, damit eine Sicherung von /data
  # allein sie nicht preisgibt. Wird er geändert, sind gespeicherte
  # Zugangsdaten nicht mehr lesbar. Server hinter einer Destination
  # (`destination:<name>`) brauchen ihn nicht: Dort setzt die Plattform
  # die Zugangsdaten ein.
  - key: MCPGW_MASTER_KEY
    label: "Tresorschlüssel für die Zugangsdaten der Server (einmal erzeugen, danach nicht ändern)"
    secret: true
    generate: token
  # Wie oft die Tools jedes Servers neu gelesen werden. Ein geänderter
  # Text sperrt das Tool bis zur Bestätigung (Spec §4.2) — je kürzer,
  # desto früher fällt eine Änderung auf.
  - key: MCPGW_CATALOG_MINUTES
    label: "Katalog neu lesen alle … Minuten (0 = nur auf Knopfdruck)"
    default: "15"
  # Anmeldung von Menschen (RFC-0065 Stufe 3, D14/D15). Leer = aus — außer
  # die Plattform reicht die Werte herein (RFC-0073 Stufe 3, Spec §3.8): Hat
  # ein Konnektor die Clients angelegt (`oaap idp mcp`, Knopf im Portal),
  # gelten für die fünf leeren Einstellungen unten OAAP_MCP_IDP_*. Ein hier
  # von Hand gesetzter Wert gewinnt.
  - key: MCPGW_ISSUER
    label: "Issuer des Anmeldediensts -- LEER LASSEN, wenn die Anmeldung im Portal mit „Anmeldung einrichten“ (Reiter Überblick, Karte MCP) eingerichtet wird; nur ohne Konnektor von Hand, genau wie im Token (z. B. https://auth.<knoten>/realms/<mandant>)"
    default: ""
  - key: MCPGW_AUDIENCE
    label: "Audience: Client-ID des vertraulichen Gateway-Clients im Realm -- leer lassen bei „Anmeldung einrichten“"
    default: ""
  - key: MCPGW_SIGNIN_CLIENT
    label: "Client-ID, mit der sich Menschen anmelden (öffentlicher Client, für Claude Code --client-id) -- leer lassen bei „Anmeldung einrichten“"
    default: ""
  # Verfahren I (RFC-0073 Stufe 2): Der angemeldete Mensch erreicht eine
  # App-Quelle der Plattform. Das Gateway tauscht sein Token mit dem
  # EIGENEN Client (MCPGW_AUDIENCE) gegen eines für den Plattform-Client
  # des Realms. Leer = Quellen nur mit Verfahren T (Agentenschlüssel).
  - key: MCPGW_CLIENT_SECRET
    label: "Geheimnis des vertraulichen Gateway-Clients für den Token-Tausch -- leer lassen bei „Anmeldung einrichten“"
    secret: true
    default: ""
  - key: MCPGW_PLATFORM_AUDIENCE
    label: "Client-ID der Plattform im Realm (Ziel des Tauschs für Verfahren I) -- leer lassen bei „Anmeldung einrichten“"
    default: ""

# RFC-0118 (0.40.0): die Anwenderhilfe geht an die Hilfe des Mandanten und damit an
# den Chat. Die Verwaltung liest alles; wer nur „Meine Werkzeuge“ benutzt, die
# Seiten dazu.
docs:
  - product: mcp-gateway
    title: "MCP-Gateway"
    path: docs/
    entry: index.md
    color: "#2563eb"
    lang: de
    audience: [user, keyuser, admin]
    readers: [end-user, power-user, admin]
    kinds:
      index.md: overview
      server-eintragen.md: howto
      sicht-freigeben.md: howto
      zugang-vergeben.md: howto
      werkzeug-anbinden.md: howto
      meine-werkzeuge.md: howto
      faq.md: faq

health:
  path: /healthz
  startup_grace_seconds: 15
