oaap_manifest: "0.10"

app:
  id: mcp-gateway
  name: OAAP MCP-Gateway
  version: 0.3.1
  type: native
  class: frontend
  description: "MCP-Server hinter einem Endpunkt je Sicht — Bündel aus Tools, Resources und Prompts mehrerer Server, mit API-Schlüsseln oder Anmeldung am Anmeldedienst des Mandanten (Zugangsprofile, Token-Tausch), Katalog mit Freigabe, festgehaltenen Texten, festen Argumenten und Grenzen, Wirkungsklassen, Schutz der Server und Verbrauchsmessung (Capability oaap.ai.mcp-gateway, RFC-0065)"

care:
  # RFC-0071 §15 (Manifest 0.10): Nur Standardbibliothek, beim Bau wird nichts nachgeladen — ein Neubau ändert nur die Basis.
  rebuild: self

services:
  web:
    build: .
    port: 8000

routes:
  # Zwei Wege in dieselbe App. Der längere Pfad gewinnt.
  #
  # /mcp ist `public`: Die Plattform authentifiziert hier NICHTS, entfernt
  # gefälschte Identitäts-Kopfzeilen und bremst je Client-Adresse
  # (RFC-0010). Geprüft wird im Dienst: Der API-Schlüssel IST die
  # Identität und nennt die Sichten, die er benutzen darf (Spec §2).
  - path: /mcp
    roles: [public]
  # Wo ein MCP-Client erfährt, bei welchem Anmeldedienst er sich anmeldet
  # (RFC 9728). Öffentlich wie /mcp, für jede Sicht gleich (Spec §2.2).
  - path: /.well-known/oauth-protected-resource
    roles: [public]
  # Die Betreiber-Sicht: Server, Katalog, Sichten, Schlüssel, Verbrauch,
  # Auswertung, /report/v1/… für ein Abrechnungssystem. Ausdrücklich
  # `admin`: Wer hier freigibt, öffnet Systeme für KI-Agenten.
  - path: /
    roles: [admin]

storage:
  # Schlüssel (nur als SHA-256), Server, Katalog, freigegebene Einträge,
  # Messzeilen, Prüfspur. KEINE Argumente, KEINE Ergebnisse: Es gibt keine
  # Spalte, in die sie passen würden (Spec §10).
  - name: data
    mount: /data

config:
  # Der Schlüssel zum Tresor für Zugangsdaten der Server. Kommt bewusst
  # aus einer ANDEREN Quelle als /data, damit eine Sicherung von /data
  # allein sie nicht preisgibt. Wird er geändert, sind gespeicherte
  # Zugangsdaten nicht mehr lesbar. Server hinter einer Destination
  # (`destination:<name>`) brauchen ihn nicht: Dort setzt die Plattform
  # die Zugangsdaten ein.
  - key: MCPGW_MASTER_KEY
    label: "Tresorschlüssel für die Zugangsdaten der Server (einmal erzeugen, danach nicht ändern)"
    secret: true
    generate: token
  # Wie oft die Tools jedes Servers neu gelesen werden. Ein geänderter
  # Text sperrt das Tool bis zur Bestätigung (Spec §4.2) — je kürzer,
  # desto früher fällt eine Änderung auf.
  - key: MCPGW_CATALOG_MINUTES
    label: "Katalog neu lesen alle … Minuten (0 = nur auf Knopfdruck)"
    default: "15"
  # Anmeldung von Menschen (RFC-0065 Stufe 3, D14/D15). Leer = aus.
  - key: MCPGW_ISSUER
    label: "Issuer des Anmeldediensts des Mandanten, genau wie im Token (z. B. https://auth.<knoten>/realms/<mandant>; leer = keine Anmeldung)"
    default: ""
  - key: MCPGW_AUDIENCE
    label: "Diese Kennung muss im Token als Audience stehen: Client-ID des vertraulichen Gateway-Clients im Realm"
    default: ""
  - key: MCPGW_SIGNIN_CLIENT
    label: "Client-ID, mit der sich Menschen anmelden (öffentlicher Client, für Claude Code --client-id)"
    default: ""

health:
  path: /healthz
  startup_grace_seconds: 15
