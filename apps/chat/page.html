<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--me:#e8f0fe;
--accent:#1d4ed8;--warn:#92400e;--warnbg:#fef3c7;--err:#b91c1c;--tool:#f3f4f6}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--panel:#1f2937;--ink:#e5e7eb;--muted:#9ca3af;
--line:#374151;--me:#1e3a8a;--accent:#93c5fd;--warn:#fcd34d;--warnbg:#422006;--err:#fca5a5;--tool:#111827}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;
display:flex}
aside{width:16rem;border-right:1px solid var(--line);background:var(--panel);display:flex;
flex-direction:column;padding:.8rem;gap:.5rem}
aside h1{font-size:1.05rem;margin:.2rem 0 .4rem}
aside .conv{display:block;width:100%;text-align:left;padding:.45rem .5rem;border:0;border-radius:.4rem;
background:none;color:var(--ink);cursor:pointer;font:inherit;overflow:hidden;text-overflow:ellipsis;
white-space:nowrap}
aside .conv.on,aside .conv:hover{background:var(--me)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:.7rem 1rem;border-bottom:1px solid var(--line);background:var(--panel)}
header .muted{font-size:.85rem}
#log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.msg{max-width:46rem;padding:.6rem .8rem;border-radius:.6rem;white-space:pre-wrap;word-break:break-word;
line-height:1.45}
.user{align-self:flex-end;background:var(--me)}
.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.call,.result{align-self:flex-start;font-size:.85rem;color:var(--muted);background:var(--tool);
border-radius:.4rem;padding:.35rem .6rem;max-width:46rem}
.result summary{cursor:pointer}
.result pre{white-space:pre-wrap;margin:.4rem 0 0;font-size:.82rem}
.confirm{align-self:flex-start;background:var(--warnbg);color:var(--warn);border-radius:.6rem;
padding:.7rem .9rem;max-width:46rem}
.confirm pre{white-space:pre-wrap;color:var(--ink);background:var(--panel);padding:.5rem;border-radius:.3rem}
.err{color:var(--err)}
.muted{color:var(--muted)}
form{display:flex;gap:.5rem;padding:.8rem 1rem;border-top:1px solid var(--line);background:var(--panel)}
textarea{flex:1;resize:none;font:inherit;padding:.5rem;border:1px solid var(--line);border-radius:.4rem;
background:var(--bg);color:var(--ink)}
button{font:inherit;padding:.45rem .9rem;border-radius:.4rem;border:1px solid var(--line);
background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
@media (max-width:700px){body{flex-direction:column;height:auto;min-height:100vh}
aside{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:30vh;overflow-y:auto}
#log{min-height:50vh}}
</style>
</head>
<body>
<aside>
  <h1 id="atitle">Chat</h1>
  <button id="new" class="primary">Neues Gespräch</button>
  <div id="convs"></div>
  <div class="muted" style="margin-top:auto;font-size:.8rem" id="who"></div>
</aside>
<main>
  <header><b id="ctitle">—</b><div class="muted" id="hint">Jede Runde läuft als du: der Assistent
  sieht nur, was du sehen darfst. Was etwas ändert, läuft erst nach deiner Zustimmung.</div></header>
  <div id="log"></div>
  <form id="f"><textarea id="t" rows="2" placeholder="Nachricht …" maxlength="4000"></textarea>
  <button class="primary" id="go">Senden</button></form>
</main>
<script>
"use strict";
let S = null, C = null, busy = false;
const $ = id => document.getElementById(id);

function el(tag, cls, text){const e=document.createElement(tag); if(cls) e.className=cls;
  if(text!==undefined) e.textContent=text; return e;}

async function api(method, path, body){
  const r = await fetch(path, {method, headers: {"Content-Type": "application/json"},
                               body: body === undefined ? undefined : JSON.stringify(body)});
  let doc = {};
  try { doc = await r.json(); } catch (e) { doc = {error: "Antwort " + r.status + " ohne JSON."}; }
  if (!r.ok && !doc.error) doc.error = "Antwort " + r.status;
  return doc;
}

function renderConvs(){
  const box = $("convs"); box.textContent = "";
  for (const c of S.conversations) {
    const b = el("button", "conv" + (C && C.id === c.id ? " on" : ""), c.title);
    b.onclick = () => openConv(c.id); box.appendChild(b);
  }
}

function render(status){
  const log = $("log"); log.textContent = "";
  $("ctitle").textContent = C ? C.title : "—";
  if (S && S.assistant && S.assistant.greeting) log.appendChild(el("div", "msg assistant", S.assistant.greeting));
  if (!C) return;
  for (const m of C.messages) {
    if (m.role === "user") log.appendChild(el("div", "msg user", m.content));
    else if (m.role === "assistant") {
      if (m.content) log.appendChild(el("div", "msg assistant", m.content));
      for (const c of m.calls || []) log.appendChild(el("div", "call",
        "Werkzeug " + c.name + " " + JSON.stringify(c.arguments || {})));
    } else if (m.role === "tool") {
      const d = el("details", "result"); const s = el("summary", "",
        "Ergebnis " + (m.name || "") + (m.confirmed === true ? " · von dir freigegeben" :
                                        m.confirmed === false ? " · von dir abgelehnt" : ""));
      d.appendChild(s); d.appendChild(el("pre", "", m.content)); log.appendChild(d);
    }
  }
  if (C.confirm && !busy) {
    const k = C.confirm, box = el("div", "confirm");
    box.appendChild(el("div", "", "Der Assistent möchte etwas " +
      (k.effect === "execute" ? "ausführen" : "ändern") + " — als du:"));
    box.appendChild(el("pre", "", k.name + " " + JSON.stringify(k.arguments, null, 2)));
    const ok = el("button", "primary", "Ausführen"), no = el("button", "", "Ablehnen");
    ok.onclick = () => decide(k.call, true); no.onclick = () => decide(k.call, false);
    box.appendChild(ok); box.appendChild(document.createTextNode(" ")); box.appendChild(no);
    log.appendChild(box);
  }
  if (status) log.appendChild(status);
  log.scrollTop = log.scrollHeight;
}

function setBusy(b, text){
  busy = b; $("go").disabled = b; $("t").disabled = b;
  render(b ? el("div", "muted", text) : null);
}

// D7: der Browser treibt die Schleife -- jede Runde eine eigene Anfrage.
async function drive(path, body, text){
  setBusy(true, text);
  let doc = await api("POST", path, body);
  while (doc.state === "more") {
    C = doc; setBusy(true, "Werkzeug läuft, danach denkt das Modell …");
    doc = await api("POST", "api/conv/" + C.id + "/step", {});
  }
  if (doc.messages) C = doc;
  busy = false; $("go").disabled = false; $("t").disabled = false;
  let status = null;
  if (doc.state === "error" || doc.error) {
    status = el("div", "err", doc.said || doc.error);
    const again = el("button", "", "Erneut versuchen");
    again.onclick = () => drive("api/conv/" + C.id + "/step", {}, "Erneuter Versuch …");
    if (C) { status.appendChild(document.createTextNode(" ")); status.appendChild(again); }
  }
  render(status);
  await refreshState();
}

function decide(call, ok){
  drive("api/conv/" + C.id + "/step", {decision: {call, ok}},
        ok ? "Werkzeug läuft, danach denkt das Modell …" : "Das Modell denkt …");
}

async function refreshState(){ S = await api("GET", "api/state"); renderConvs(); }

async function openConv(id){ C = await api("GET", "api/conv/" + id); render(); renderConvs(); }

$("new").onclick = async () => { C = await api("POST", "api/conv", {}); await refreshState(); render(); };

$("f").onsubmit = async ev => {
  ev.preventDefault();
  const text = $("t").value.trim(); if (!text || busy) return;
  if (!C || !C.id) { C = await api("POST", "api/conv", {}); }
  $("t").value = "";
  await drive("api/conv/" + C.id + "/send", {text}, "Das Modell denkt …");
};
$("t").addEventListener("keydown", ev => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("f").requestSubmit(); }
});

(async () => {
  await refreshState();
  if (S.error) { $("log").appendChild(el("div", "err", S.error)); return; }
  $("atitle").textContent = S.assistant.title;
  $("who").textContent = (S.user || "") + " · Chat " + S.version;
  for (const e of S.errors || []) $("log").appendChild(el("div", "err", e));
  if (S.conversations.length) await openConv(S.conversations[0].id); else render();
})();
</script>
</body>
</html>
