<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--me:#e8f0fe;
--accent:#1d4ed8;--accentink:#fff;--warn:#92400e;--warnbg:#fef3c7;--err:#b91c1c;--tool:#f3f4f6;--pat:rgba(17,24,39,.07);
--gap:.6rem;--pad:.6rem .8rem;--fs:1rem;--col:56rem}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111827;--panel:#1f2937;--ink:#e5e7eb;--muted:#9ca3af;
--line:#374151;--me:#1e3a8a;--accent:#93c5fd;--accentink:#111827;--warn:#fcd34d;--warnbg:#422006;--err:#fca5a5;--tool:#111827;--pat:rgba(255,255,255,.06)}}
:root[data-theme=dark]{--bg:#111827;--panel:#1f2937;--ink:#e5e7eb;--muted:#9ca3af;
--line:#374151;--me:#1e3a8a;--accent:#93c5fd;--accentink:#111827;--warn:#fcd34d;--warnbg:#422006;--err:#fca5a5;--tool:#111827;--pat:rgba(255,255,255,.06)}
body[data-density=compact]{--gap:.3rem;--pad:.4rem .6rem}
body[data-size=large]{--fs:1.12rem}
*{box-sizing:border-box}
/* Ein Bildschirm, nichts scrollt außer Verlauf, Gesprächsliste und Assistenten-Raster. */
html,body{height:100%}
body{margin:0;font-family:system-ui,sans-serif;font-size:var(--fs);background:var(--bg);color:var(--ink);
height:100vh;height:100dvh;overflow:hidden;display:flex}
button{font:inherit;padding:.45rem .9rem;border-radius:.4rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accentink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.icon{border:0;background:none;padding:.35rem .55rem;font-size:1.15rem;line-height:1;border-radius:.4rem}
button.icon:hover{background:var(--me)}
textarea,input,select{font:inherit;padding:.45rem;border:1px solid var(--line);border-radius:.4rem;background:var(--bg);color:var(--ink)}
.muted{color:var(--muted)} .err{color:var(--err)}

/* ---- Seitenleiste */
aside{width:17rem;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
body.side-off aside{display:none}
.shead{display:flex;align-items:center;justify-content:space-between;padding:.6rem .8rem .2rem}
.shead b{font-size:1.05rem}
.sact{display:flex;flex-direction:column;gap:.45rem;padding:.4rem .8rem .5rem}
#convs{flex:1;min-height:0;overflow-y:auto;padding:0 .5rem .5rem}
.grp-h{display:flex;width:100%;align-items:center;gap:.3rem;border:0;background:none;padding:.6rem .4rem .2rem;
font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.grp-h .n{margin-left:auto;text-transform:none}
.conv{display:block;width:100%;text-align:left;padding:.45rem .5rem;border:0;border-radius:.4rem;
background:none;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv.on,.conv:hover{background:var(--me)}
.conv small{color:var(--muted);margin-left:.3rem}
.empty{padding:.6rem .4rem;font-size:.9rem}
.sfoot{border-top:1px solid var(--line);padding:.4rem .5rem .6rem;display:flex;flex-direction:column;gap:.1rem}
.sfoot button{text-align:left;border:0;background:none;padding:.45rem .5rem}
.sfoot button:hover,.sfoot button.on{background:var(--me)}
#who{font-size:.75rem;padding:.3rem .5rem 0}
#scrim{display:none}

/* ---- Arbeitsfläche */
main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
header{flex:none;display:flex;align-items:center;gap:.4rem;padding:.45rem .6rem;border-bottom:1px solid var(--line);background:var(--panel)}
.htitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle .muted{font-size:.88rem;margin-left:.4rem}
details.menu{position:relative}
details.menu>summary{list-style:none;padding:.35rem .55rem;font-size:1.15rem;line-height:1;border-radius:.4rem;cursor:pointer}
details.menu>summary:hover{background:var(--me)}
details.menu>summary::-webkit-details-marker{display:none}
.mbody{position:absolute;right:0;top:calc(100% + .3rem);background:var(--panel);border:1px solid var(--line);border-radius:.5rem;
box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:14rem;z-index:20;padding:.3rem}
.mbody button{display:block;width:100%;text-align:left;border:0;background:none;padding:.5rem .7rem}
.mbody button:hover{background:var(--me)}
.mbody hr{border:0;border-top:1px solid var(--line);margin:.25rem 0}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.view[hidden]{display:none}

/* ---- Verlauf */
#log{flex:1;min-height:0;overflow-y:auto;padding:1rem .8rem;display:flex;flex-direction:column;gap:var(--gap)}
.stack{display:flex;flex-direction:column;gap:var(--gap);width:100%;max-width:var(--col);margin:0 auto}
body[data-bg=dots] #log{background-image:radial-gradient(var(--pat) 1.2px,transparent 1.3px);background-size:16px 16px}
body[data-bg=grid] #log{background-image:linear-gradient(var(--pat) 1px,transparent 1px),linear-gradient(90deg,var(--pat) 1px,transparent 1px);background-size:24px 24px}
body[data-bg=lines] #log{background-image:repeating-linear-gradient(45deg,var(--pat) 0 2px,transparent 2px 14px)}
body[data-bg=warm] #log{background-image:linear-gradient(160deg,rgba(251,191,36,.14),rgba(244,114,182,.12))}
body[data-bg=cool] #log{background-image:linear-gradient(160deg,rgba(56,189,248,.14),rgba(129,140,248,.14))}
.msg{max-width:46rem;padding:var(--pad);border-radius:.7rem;white-space:pre-wrap;word-break:break-word;line-height:1.45}
.user{align-self:flex-end;background:var(--me)}
.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line);white-space:normal}
.pending{opacity:.75}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:.45rem 0}.md h3,.md h4,.md h5,.md h6{margin:.7rem 0 .35rem;font-size:1rem}
.md ul,.md ol{margin:.35rem 0;padding-left:1.4rem}
.md code{background:var(--tool);border-radius:.25rem;padding:.05rem .3rem;font-size:.88em}
.md pre{background:var(--tool);border-radius:.4rem;padding:.6rem;overflow-x:auto;white-space:pre}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;margin:.4rem 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:.25rem .5rem;text-align:left;vertical-align:top}
.md blockquote{margin:.4rem 0;padding-left:.7rem;border-left:3px solid var(--line);color:var(--muted)}
.md a{color:var(--accent)} .md hr{border:0;border-top:1px solid var(--line)}
.mermaid-src svg{max-width:100%;height:auto;background:#fff;border-radius:.3rem}
.thinking{align-self:flex-start;display:flex;align-items:center;gap:.6rem;color:var(--muted);font-size:.9rem;
padding:.5rem .8rem;border:1px solid var(--line);border-radius:.7rem;background:var(--panel)}
.dots{display:inline-flex;gap:.25rem}
.dots i{width:.45rem;height:.45rem;border-radius:50%;background:var(--accent);opacity:.25;animation:blink 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.85)}40%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}aside{transition:none!important}}
.cmd{font-size:.8rem;color:var(--muted);display:block;margin-bottom:.2rem}
.call,.result{align-self:flex-start;font-size:.85rem;color:var(--muted);background:var(--tool);
border-radius:.4rem;padding:.35rem .6rem;max-width:46rem}
.result summary{cursor:pointer}
.result pre{white-space:pre-wrap;margin:.4rem 0 0;font-size:.82rem}
.view-box{align-self:stretch}
.confirm{align-self:flex-start;background:var(--warnbg);color:var(--warn);border-radius:.6rem;padding:.7rem .9rem;max-width:46rem}
.confirm pre{white-space:pre-wrap;color:var(--ink);background:var(--panel);padding:.5rem;border-radius:.3rem}
.hint{align-self:center;text-align:center;max-width:32rem;margin-top:2rem}

/* ---- Eingabe */
.composer{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:.5rem .8rem calc(.6rem + env(safe-area-inset-bottom))}
.composer>*{max-width:var(--col);margin-left:auto;margin-right:auto}
#cmds{font-size:.85rem;color:var(--muted);max-height:40vh;overflow-y:auto}
#cmds:not(:empty){padding:.2rem 0 .4rem;border-bottom:1px solid var(--line);margin-bottom:.4rem}
#cmds .ci{display:block;width:100%;text-align:left;border:0;border-radius:.4rem;padding:.35rem .5rem;margin:0;background:none}
#cmds .ci b{font-weight:600;color:var(--ink)} #cmds .ci span{color:var(--muted);margin-left:.5rem}
#cmds .ci.sel,#cmds .ci:hover{background:var(--me)}
#cmds .grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;margin:.3rem .5rem .1rem}
form.send{display:flex;gap:.5rem;align-items:flex-end}
form.send textarea{flex:1;resize:none;max-height:12rem;line-height:1.4}
.crow{display:flex;gap:.5rem;align-items:center;font-size:.8rem;color:var(--muted);margin-top:.35rem;flex-wrap:wrap}
.crow select{font-size:.8rem;padding:.15rem .3rem;max-width:16rem}
.crow .note{margin-left:auto}

/* ---- Assistenten */
.atool{flex:none;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;padding:.7rem 1rem;border-bottom:1px solid var(--line);background:var(--panel)}
.atool input[type=search]{flex:1;min-width:10rem}
.atool label.imp{font-size:.88rem;color:var(--accent);cursor:pointer}
.atool a{color:var(--accent);font-size:.88rem}
.agrid{flex:1;min-height:0;overflow-y:auto;padding:1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:.8rem;align-content:start}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.35rem}
.acard h3{margin:0;font-size:1rem}
.acard p{margin:0;font-size:.88rem;color:var(--muted)}
.acard .acts{margin-top:auto;display:flex;gap:.35rem;flex-wrap:wrap;padding-top:.5rem}
.acard .acts button{font-size:.85rem;padding:.3rem .7rem}
.badge{display:inline-block;font-size:.72rem;padding:.08rem .45rem;border-radius:.7rem;background:var(--tool);color:var(--muted);margin:0 .25rem .15rem 0}

/* ---- Dialoge */
dialog{border:1px solid var(--line);border-radius:.7rem;background:var(--panel);color:var(--ink);width:min(40rem,calc(100vw - 2rem));max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog label{display:block;font-size:.85rem;margin:.6rem 0 .2rem;color:var(--muted)}
dialog input,dialog textarea,dialog select{width:100%}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.setup li{margin:.35rem 0;list-style:none}.setup ul{padding:0;margin:.3rem 0}
.setup .next{color:var(--muted);font-size:.88rem;display:block}
.hbtn{font-size:.8rem;padding:.2rem .55rem}
.seg{display:flex;flex-wrap:wrap;gap:.35rem}
.seg button{font-size:.88rem;padding:.35rem .7rem}
.seg button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.sw{width:3.2rem;height:2.4rem;padding:0;border-radius:.4rem;background-color:var(--bg)}
.sw[data-v=dots]{background-image:radial-gradient(var(--muted) 1px,transparent 1.2px);background-size:8px 8px}
.sw[data-v=grid]{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:10px 10px}
.sw[data-v=lines]{background-image:repeating-linear-gradient(45deg,var(--line) 0 2px,transparent 2px 8px)}
.sw[data-v=warm]{background-image:linear-gradient(160deg,rgba(251,191,36,.45),rgba(244,114,182,.4))}
.sw[data-v=cool]{background-image:linear-gradient(160deg,rgba(56,189,248,.45),rgba(129,140,248,.45))}

/* ---- Schmal: Leiste als Schublade, Vollbild ohne Seiten-Scrollen */
@media (max-width:800px){
  aside{position:fixed;inset:0 auto 0 0;z-index:30;width:min(20rem,86vw);transform:translateX(-102%);transition:transform .2s ease}
  body.side-off aside{display:flex}
  body.side-on aside{transform:none;box-shadow:0 0 30px rgba(0,0,0,.25)}
  body.side-on #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  #log{padding:.8rem .6rem}
  .crow .note{display:none}
}
</style>
</head>
<body>
<aside id="side" aria-label="Gespräche">
  <div class="shead"><b>Chat</b><button class="icon" id="sclose" type="button" title="Leiste einklappen" aria-label="Leiste einklappen">«</button></div>
  <div class="sact">
    <button id="new" class="primary" type="button">+ Neues Gespräch</button>
    <input id="q" type="search" placeholder="Gespräche durchsuchen" aria-label="Gespräche durchsuchen">
  </div>
  <div id="convs"></div>
  <div class="sfoot">
    <button id="manage" type="button">Assistenten</button>
    <button id="nset" type="button">Einstellungen</button>
    <div class="muted" id="who"></div>
  </div>
</aside>
<div id="scrim"></div>
<main>
  <header>
    <button class="icon" id="sopen" type="button" title="Gespräche ein- und ausblenden" aria-label="Gespräche ein- und ausblenden">☰</button>
    <div class="htitle"><b id="ctitle">—</b><span class="muted" id="cassist"></span></div>
    <details class="menu" id="menu"><summary role="button" aria-label="Menü" title="Menü">⋯</summary>
      <div class="mbody">
        <button id="ren" type="button">Umbenennen</button>
        <button id="del" type="button">Löschen</button>
        <hr>
        <button id="chk" type="button">Einrichtung prüfen</button>
        <button id="fs" type="button">Vollbild</button>
        <button id="mset" type="button">Einstellungen</button>
      </div>
    </details>
  </header>

  <section class="view" id="chatview">
    <div id="log"></div>
    <div class="composer">
      <div id="cmds"></div>
      <form id="f" class="send"><textarea id="t" rows="1" placeholder="Nachricht … (/ für Befehle)" maxlength="4000" aria-label="Nachricht"></textarea>
        <button class="primary" id="go">Senden</button></form>
      <div class="crow"><label for="pick">Assistent</label><select id="pick"></select>
        <span class="note">Jede Runde läuft als du. Was etwas ändert, läuft erst nach deiner Zustimmung.</span></div>
    </div>
  </section>

  <section class="view" id="asstview" hidden>
    <div class="atool">
      <input type="search" id="aq" placeholder="Assistenten durchsuchen" aria-label="Assistenten durchsuchen">
      <select id="ascope" aria-label="Filter">
        <option value="all">alle</option><option value="mine">die ich ändern darf</option>
        <option value="private">privat</option><option value="context">Team</option><option value="tenant">Mandant</option></select>
      <button class="primary" id="anewbtn" type="button">+ Neuer Assistent</button>
      <a id="aexp" href="api/assistants/export" download="assistenten.json">Exportieren</a>
      <label class="imp">Importieren <input type="file" id="aimp" accept="application/json" hidden></label>
    </div>
    <p class="err" id="alisterr" style="margin:.5rem 1rem 0"></p>
    <div class="agrid" id="alist"></div>
  </section>
</main>

<dialog id="sdlg"><div id="sbox"></div></dialog>

<dialog id="setdlg">
  <div class="dhead"><b>Einstellungen</b><button type="button" class="hbtn" id="setclose">Schließen</button></div>
  <p class="muted" style="font-size:.85rem">Gilt für diesen Browser.</p>
  <label>Darstellung</label><div class="seg" data-k="theme">
    <button type="button" data-v="system">wie das System</button><button type="button" data-v="light">hell</button><button type="button" data-v="dark">dunkel</button></div>
  <label>Hintergrund des Verlaufs</label><div class="seg" data-k="bg">
    <button type="button" class="sw" data-v="none" title="schlicht" aria-label="schlicht"></button><button type="button" class="sw" data-v="dots" title="Punkte" aria-label="Punkte"></button>
    <button type="button" class="sw" data-v="grid" title="Raster" aria-label="Raster"></button><button type="button" class="sw" data-v="lines" title="Linien" aria-label="Linien"></button>
    <button type="button" class="sw" data-v="warm" title="warm" aria-label="warm"></button><button type="button" class="sw" data-v="cool" title="kühl" aria-label="kühl"></button></div>
  <label>Dichte</label><div class="seg" data-k="density">
    <button type="button" data-v="normal">normal</button><button type="button" data-v="compact">kompakt</button></div>
  <label>Schriftgröße</label><div class="seg" data-k="size">
    <button type="button" data-v="normal">normal</button><button type="button" data-v="large">groß</button></div>
  <label>Gespräche gruppieren</label><div class="seg" data-k="group">
    <button type="button" data-v="assistant">nach Assistent</button><button type="button" data-v="time">nach Zeit</button><button type="button" data-v="none">nicht</button></div>
</dialog>

<dialog id="dlg">
  <div class="dhead"><b id="dtitle">Neuer Assistent</b><button id="dclose" type="button" class="hbtn">Schließen</button></div>
  <form id="af">
    <label>Kennung (Kleinbuchstaben, Ziffern, Bindestrich)</label><input name="id" required pattern="[a-z0-9][a-z0-9-]{0,47}">
    <label>Titel</label><input name="title" required maxlength="80">
    <label>Begrüßung</label><input name="greeting" maxlength="500">
    <label>Anweisung an das Modell (Systemprompt)</label><textarea name="system" rows="5" required maxlength="8000"></textarea>
    <div class="row">
      <div style="flex:1"><label>Modellname des KI-Gateways</label><input name="model" value="standard" required></div>
      <div style="flex:1"><label>Sicht des MCP-Gateways</label><input name="view" required></div>
      <div style="flex:1"><label>Gateway (leer = das einzige)</label><input name="gateway"></div>
    </div>
    <div class="row">
      <div style="flex:1"><label>Wer sieht ihn?</label><select name="scope">
        <option value="private">nur ich</option><option value="context">ein Team</option>
        <option value="tenant">alle im Mandanten</option></select></div>
      <div style="flex:1"><label>Team (bei „ein Team“)</label><input name="team"></div>
    </div>
    <label><input type="checkbox" name="commands" style="width:auto"> /Befehle aus den Prompts der Sicht anbieten</label>
    <label><input type="checkbox" name="views" style="width:auto"> Ansichten der Werkzeuge zeigen (MCP Apps)</label>
    <p class="err" id="aerr"></p>
    <div class="row"><button class="primary">Speichern</button></div>
  </form>
</dialog>

<script src="static/markdown.js"></script>
<script>
"use strict";
let S = null, C = null, busy = false, CMDS = [], SETUP = null, PENDING = null, SEL = 0;
const $ = id => document.getElementById(id);
function el(tag, cls, text){const e=document.createElement(tag); if(cls) e.className=cls;
  if(text!==undefined) e.textContent=text; return e;}
const narrow = () => matchMedia("(max-width:800px)").matches;

// ---- Einstellungen: nur in diesem Browser (localStorage); ohne Speicher gelten die Vorgaben.
const SET = {theme: "system", bg: "none", density: "normal", size: "normal", group: "assistant"};
function load(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function keep(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
Object.assign(SET, load("chat.settings", {}));
const FOLD = new Set(load("chat.fold", []));
let SIDE_OFF = !!load("chat.sideoff", false);
const isDark = () => SET.theme === "dark" || (SET.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
function applySet(){
  const r = document.documentElement;
  if (SET.theme === "system") r.removeAttribute("data-theme"); else r.dataset.theme = SET.theme;
  const b = document.body; b.dataset.bg = SET.bg; b.dataset.density = SET.density; b.dataset.size = SET.size;
  for (const seg of document.querySelectorAll("#setdlg .seg"))
    for (const x of seg.querySelectorAll("button")) x.classList.toggle("on", SET[seg.dataset.k] === x.dataset.v);
}
function setOne(k, v){
  const was = isDark(); SET[k] = v; keep("chat.settings", SET); applySet();
  if (k === "group") renderSide();
  if (was !== isDark()) rethemeMermaid();
}
applySet();

// Mermaid nur laden, wenn eine Antwort ein Diagramm hat; jedes Diagramm nur einmal zeichnen.
const SVG = new Map();
let mermaidReady = null;
function loadMermaid(){
  if (!mermaidReady) mermaidReady = new Promise((ok, no) => {
    const sc = document.createElement("script"); sc.src = "static/mermaid.min.js";
    sc.onload = () => { window.mermaid.initialize({startOnLoad: false, securityLevel: "strict", theme: isDark() ? "dark" : "default"}); ok(); };
    sc.onerror = no; document.head.appendChild(sc);
  });
  return mermaidReady;
}
function rethemeMermaid(){
  if (!window.mermaid) return;
  window.mermaid.initialize({startOnLoad: false, securityLevel: "strict", theme: isDark() ? "dark" : "default"});
  SVG.clear(); SHOWN = {id: null, n: 0}; render();
}
async function drawMermaid(root){
  const boxes = root.querySelectorAll(".mermaid-src");
  if (!boxes.length) return;
  for (const b of boxes) { const src = b.dataset.src; if (SVG.has(src)) b.innerHTML = SVG.get(src); }
  const todo = [...boxes].filter(b => !SVG.has(b.dataset.src));
  if (!todo.length) return;
  try { await loadMermaid(); } catch (e) { return; }
  let n = 0;
  for (const b of todo) {
    const src = b.dataset.src;

                b.innerHTML = SVG.get(src); }

function mdEl(text){ const d = el("div", "msg assistant md"); d.innerHTML = window.ChatMarkdown.render(text); return d; }
async function api(method, path, body){

  if (!r.ok && !doc.error && !doc.errors) doc.error = "Antwort " + r.status;
  return doc;
}

function toggleSide(force){

function timeGroup(iso){
  const d = new Date(iso); if (isNaN(d)) return "Älter";
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (d >= today) return "Heute";
  const days = (today - d) / 86400000;
  return days <= 1 ? "Gestern" : days <= 7 ? "Letzte 7 Tage" : days <= 30 ? "Letzte 30 Tage" : "Älter";
}
function when(iso){
  const d = new Date(iso); if (isNaN(d)) return "";
  return d.toDateString() === new Date().toDateString() ? d.toLocaleTimeString("de-DE", {hour: "2-digit", minute: "2-digit"})
                                                        : d.toLocaleDateString("de-DE", {day: "2-digit", month: "2-digit"});
}
function renderSide(){

  if (C && assistant(C.assistant)) pick.value = C.assistant; else if (was && assistant(was)) pick.value = was;
  pick.disabled = !!C;

    .sort((x, y) => String(y.updated || "").localeCompare(String(x.updated || "")));
  const groups = new Map();
  for (const c of list) {
    const k = SET.group === "time" ? timeGroup(c.updated) : SET.group === "assistant" ? titleOf(c) : "";
    if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c);
  }
  const box = $("convs"); box.textContent = "";
  for (const [k, cs] of groups) {

// Neu zeichnen, ohne Ansichten neu zu laden: Nachrichten werden nur angehängt, solange
// es dasselbe Gespräch ist (ein iframe, das man umhängt, lädt neu).
let SHOWN = {id: null, n: 0};
function msgNodes(m){
  const out = [];
  if (m.role === "user") {
    const d = el("div", "msg user");
    if (m.command) d.appendChild(el("span", "cmd", "/" + m.command));
    d.appendChild(document.createTextNode(m.content)); out.push(d);
  } else if (m.role === "assistant" && m.content) {
    out.push(mdEl(m.content));
  }
  for (const c of m.calls || []) out.push(el("div", "call", "Werkzeug " + c.name + " " + JSON.stringify(c.arguments || {})));
  if (m.role === "tool") {
    const d = el("details", "result");
    d.appendChild(el("summary", "", "Ergebnis " + (m.name || "") + (m.confirmed === true ? " · von dir freigegeben" :
                                                             m.confirmed === false ? " · von dir abgelehnt" : "")));
    d.appendChild(el("pre", "", m.content)); out.push(d);
    const a = C ? assistant(C.assistant) : null;
    if (m.view && a && a.views) out.push(viewFrame(m));
  }
  return out;
}

function render(status){
  if (!S) return;
  const log = $("log");
  const a = current();
  if (VIEW === "chat") {
    $("ctitle").textContent = C ? C.title : "Neues Gespräch";
    $("cassist").textContent = a ? "mit " + a.title : (C ? "Assistent nicht verfügbar" : "");
  }
  $("ren").disabled = $("del").disabled = !C;
  let head = $("loghead"), msgs = $("logmsgs"), tail = $("logtail");
  if (!head) {
    log.textContent = "";
    head = el("div", "stack"); head.id = "loghead"; msgs = el("div", "stack"); msgs.id = "logmsgs"; tail = el("div", "stack"); tail.id = "logtail";
    log.append(head, msgs, tail);
  }
  head.textContent = "";
  if (a && a.greeting) head.appendChild(mdEl(a.greeting));
  if (!C) {
    msgs.textContent = ""; tail.textContent = ""; SHOWN = {id: null, n: 0}; dropFrames();
    if (!S.assistants.length) head.appendChild(el("div", "muted hint", "Für dich ist noch kein Assistent sichtbar. Lege unter „Assistenten“ einen eigenen an."));
    else if (a && !a.greeting && !PENDING) head.appendChild(el("div", "muted hint", "Neues Gespräch mit " + a.title + ". Schreib deine erste Nachricht."));
    if (PENDING) tail.appendChild(el("div", "msg user pending", PENDING));
    if (status) tail.appendChild(status);
    return;
  }
  if (SHOWN.id !== C.id || C.messages.length < SHOWN.n) { msgs.textContent = ""; SHOWN = {id: C.id, n: 0}; dropFrames(); }
  for (const m of C.messages.slice(SHOWN.n)) for (const node of msgNodes(m)) msgs.appendChild(node);
  SHOWN.n = C.messages.length;
  tail.textContent = "";
  if (C.confirm && !busy) {
    const k = C.confirm, box = el("div", "confirm");
    box.appendChild(el("div", "", "Der Assistent möchte etwas " + (k.effect === "execute" ? "ausführen" : "ändern") + " — als du:"));
    box.appendChild(el("pre", "", k.name + " " + JSON.stringify(k.arguments, null, 2)));
    const ok = el("button", "primary", "Ausführen"), no = el("button", "", "Ablehnen");
    ok.onclick = () => decide(k.call, true); no.onclick = () => decide(k.call, false);
    box.append(ok, " ", no); tail.appendChild(box);
  }
  if (PENDING) tail.appendChild(el("div", "msg user pending", PENDING));
  if (status) tail.appendChild(status);
  log.scrollTop = log.scrollHeight;
  drawMermaid(msgs).then(() => { log.scrollTop = log.scrollHeight; });
}

// ---- Ansichten von MCP Apps (RFC-0075): der Chat ist der Host. Die Ansicht läuft im
// Sandbox-Proxy auf der zweiten Herkunft dieser Instanz; jede Nachricht wird hier
// geprüft, Aufrufe gehen durch die Türen des Chats -- als du, schreibend nur nach Zustimmung.
const FRAMES = [];
function sandboxOrigin(){
  const list = (S && S.sandbox_origins) || [];
  const rest = location.host.split(".").slice(1).join(".");
  return list.find(o => o.split("://")[1].split(".").slice(1).join(".") === rest) || list[0] || "";
}
function dropFrames(){ FRAMES.length = 0; }
function viewFrame(m){
  const box = el("div", "view-box");
  const origin = sandboxOrigin();
  if (!origin) { box.appendChild(el("div", "muted", "Ansicht nicht verfügbar: dieser Chat hat keine zweite Herkunft (Plattform ab 0.1.245).")); return box; }
  const f = document.createElement("iframe");
  f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms");
  f.setAttribute("title", "Ansicht " + (m.name || ""));
  f.style.cssText = "width:100%;height:120px;border:1px solid var(--line);border-radius:.5rem;background:var(--panel)";
  f.src = origin + "/ui-sandbox";
  box.appendChild(f);
  FRAMES.push({frame: f, origin, conv: C.id, call: m.tool_call_id, name: m.name, doc: null, ready: false});
  return box;
}
function toView(st, msg){ st.frame.contentWindow.postMessage(msg, st.origin); }
function reply(st, id, result){ toView(st, {jsonrpc: "2.0", id, result}); }
function fail(st, id, code, message){ toView(st, {jsonrpc: "2.0", id, error: {code, message}}); }

async function viewCall(st, body){
  let r = await api("POST", "api/conv/" + st.conv + "/view-call", body);
  if (r.confirm) {
    const k = r.confirm;
    // D4: die Zustimmung fragt der Chat selbst -- nicht die Ansicht.
    const yes = confirm("Die Ansicht von " + st.name + " möchte etwas " + (k.effect === "execute" ? "ausführen" : "ändern") +
                        " — als du:\n\n" + k.name + " " + JSON.stringify(k.arguments, null, 2) + "\n\nAusführen?");
    if (!yes) return {error: "Von dir abgelehnt."};
    r = await api("POST", "api/conv/" + st.conv + "/view-call", Object.assign({}, body, {confirmed: true}));
  }
  return r;
}

window.addEventListener("message", async ev => {
  const st = FRAMES.find(x => x.frame.contentWindow === ev.source);
  if (!st || ev.origin !== st.origin) return;
  const m = ev.data;
  if (!m || m.jsonrpc !== "2.0") return;
  if (m.method === "ui/notifications/sandbox-proxy-ready") {
    const doc = await api("GET", "api/conv/" + st.conv + "/view?call=" + encodeURIComponent(st.call));
    if (doc.error) { st.frame.replaceWith(el("div", "err", "Ansicht: " + doc.error)); return; }
    st.doc = doc;
    toView(st, {jsonrpc: "2.0", method: "ui/notifications/sandbox-resource-ready",
                params: {html: doc.html, csp: {}, permissions: {}}});
    return;
  }
  if (m.method === "ui/notifications/initialized" && st.doc && !st.ready) {
    st.ready = true;
    toView(st, {jsonrpc: "2.0", method: "ui/notifications/tool-input", params: {arguments: st.doc.arguments || {}}});
    toView(st, {jsonrpc: "2.0", method: "ui/notifications/tool-result", params: st.doc.result || {}});
    return;
  }
  if (m.method === "ui/notifications/size-changed" && m.params) {
    st.frame.style.height = Math.min(Math.max(Number(m.params.height) || 0, 60), 900) + 2 + "px";
    return;
  }
  if (m.id === undefined || typeof m.method !== "string") return;
  const p = m.params || {};
  if (m.method === "ui/initialize") {
    return reply(st, m.id, {protocolVersion: "2026-01-26",
      hostCapabilities: {openLinks: {}, serverTools: {}, serverResources: {}},
      hostInfo: {name: "oaap-chat", version: (S && S.version) || ""},
      hostContext: {toolInfo: {tool: {name: st.name}}, theme: isDark() ? "dark" : "light",
                    displayMode: "inline", availableDisplayModes: ["inline"], locale: "de-DE"}});
  }
  if (m.method === "ping") return reply(st, m.id, {});
  if (m.method === "tools/call") {
    const r = await viewCall(st, {name: p.name, arguments: p.arguments || {}});
    return r.error ? fail(st, m.id, -32000, r.error) : reply(st, m.id, r.result);
  }
  if (m.method === "resources/read") {
    const r = await api("POST", "api/conv/" + st.conv + "/view-call", {method: "resources/read", uri: p.uri});
    return r.error ? fail(st, m.id, -32000, r.error) : reply(st, m.id, r.result);
  }
  if (m.method === "ui/open-link") {
    if (!/^https?:\/\//i.test(String(p.url || ""))) return fail(st, m.id, -32000, "Invalid URL");
    window.open(p.url, "_blank", "noopener,noreferrer");
    return reply(st, m.id, {});
  }
  if (m.method === "ui/message") {
    // D5: der Vorschlag landet im Eingabefeld -- gesendet wird nur von dir.
    const text = ((p.content || {}).text || "").slice(0, 4000);
    if (text) { $("t").value = text; grow(); $("t").focus(); }
    return reply(st, m.id, {});
  }
  if (m.method === "ui/request-display-mode") return reply(st, m.id, {mode: "inline"});
  return fail(st, m.id, -32601, "Dieser Chat kann " + m.method + " noch nicht.");
});

// „Einrichtung prüfen“: was fehlt, und der nächste Schritt -- als Dialog, damit es
// auch in einem langen Gespräch zu sehen ist.
function setupBox(r){
  const box = el("div", "setup"), ok = r.items.every(i => i.ok);
  box.appendChild(el("b", "", ok ? "Einrichtung: alles da." : "Einrichtung: es fehlt noch etwas."));
  const ul = el("ul");
  for (const i of r.items) {
    const li = el("li", i.ok ? "" : "err", (i.ok ? "✓ " : "✗ ") + i.title + (i.detail ? " — " + i.detail : ""));
    if (i.next) li.appendChild(el("span", "next", "Nächster Schritt: " + i.next));
    ul.appendChild(li);
  }
  box.appendChild(ul);
  const close = el("button", "hbtn", "Schließen"); close.type = "button";
  close.onclick = () => { SETUP = null; $("sdlg").close(); }; box.appendChild(close);
  return box;
}
function showSetup(){
  const b = $("sbox"); b.textContent = "";
  if (!SETUP) return;
  b.appendChild(setupBox(SETUP));
  if (!$("sdlg").open) $("sdlg").showModal();
}
async function checkSetup(aid){
  if (!aid) return;
  SETUP = {assistant: aid, items: [{ok: true, title: "Prüfe …", detail: "", next: ""}]}; showSetup();
  const r = await api("GET", "api/setup?assistant=" + encodeURIComponent(aid));
  SETUP = r.items ? r : {assistant: aid, items: [{ok: false, title: "Prüfung", detail: r.error || "fehlgeschlagen", next: ""}]};
  showSetup();

// Warten sichtbar machen: die eigene Frage steht sofort da (PENDING), darunter drei Punkte.
function thinking(text){
  const d = el("div", "thinking"), dots = el("span", "dots");
  dots.append(el("i"), el("i"), el("i")); d.append(dots, el("span", "", text)); return d;
}
function setBusy(b, text){ busy = b; $("go").disabled = b; $("t").disabled = b; render(b ? thinking(text) : null); }

// D7: der Browser treibt die Schleife -- jede Runde eine eigene Anfrage.
async function drive(path, body, text){
  setBusy(true, text);
  let doc = await api("POST", path, body);
  PENDING = null;
  while (doc.state === "more") {
    C = doc; setBusy(true, "Werkzeug läuft, danach denkt das Modell …");
    doc = await api("POST", "api/conv/" + C.id + "/step", {});
  }
  if (doc.messages) C = doc;
  busy = false; $("go").disabled = false; $("t").disabled = false;
  let status = null;
  if (doc.state === "error" || doc.error) {
    status = el("div", "err", doc.said || doc.error);
    if (doc.state === "error") {
      const again = el("button", "", "Erneut versuchen");
      again.onclick = () => drive("api/conv/" + C.id + "/step", {}, "Erneuter Versuch …");
      status.append(" ", again);
    }
  }
  render(status);
  await refreshState();
  if (!narrow()) $("t").focus();
}
function decide(call, ok){
  drive("api/conv/" + C.id + "/step", {decision: {call, ok}}, ok ? "Werkzeug läuft, danach denkt das Modell …" : "Das Modell denkt …");
}

// ---- /Befehle: eine Suchliste, die immer etwas sagt
let CMDSAID = "";
async function loadCommands(){
  CMDS = []; CMDSAID = ""; $("cmds").textContent = "";
  const a = C ? assistant(C.assistant) : null;
  if (!a || !a.commands) return;
  const r = await api("GET", "api/conv/" + C.id + "/commands");
  CMDS = r.commands || [];
  CMDSAID = r.said || "";
  showCommands();
}
// Befehle des Chats selbst -- laufen im Browser, gehen nie ans Modell.
// Ein Prompt der Sicht mit demselben Namen geht vor.
const OWN = [
  {name: "neu", description: "Neues Gespräch mit dem gewählten Assistenten", run: () => $("new").click()},
  {name: "pruefen", description: "Einrichtung prüfen", run: () => $("chk").click()},
  {name: "umbenennen", description: "Dieses Gespräch umbenennen", run: () => $("ren").click()},
  {name: "assistenten", description: "Assistenten anlegen und ändern", run: () => $("manage").click()},
  {name: "einstellungen", description: "Darstellung, Hintergrund, Gruppen", run: () => $("nset").click()},
];
const ownCmd = name => CMDS.some(c => c.name === name) ? null : OWN.find(o => o.name === name);
function cmdMatches(){
  const t = $("t").value;
  if (!t.startsWith("/") || /\s/.test(t)) return null;
  const q = t.slice(1).toLowerCase();
  const hit = c => !q || c.name.toLowerCase().includes(q) || (c.description || "").toLowerCase().includes(q);
  return {prompts: CMDS.filter(hit), own: OWN.filter(o => hit(o) && !CMDS.some(c => c.name === o.name))};
}
function pickCmd(c){
  if (c.run) { $("t").value = ""; showCommands(); c.run(); return; }
  $("t").value = "/" + c.name + " "; $("t").focus(); showCommands();
}
function showCommands(){
  const box = $("cmds"); box.textContent = "";
  const m = cmdMatches();
  if (!m) return;
  const a = current();
  const all = m.prompts.concat(m.own);
  SEL = Math.min(SEL, Math.max(all.length - 1, 0));
  let i = 0;
  const item = c => {
    const b = el("button", "ci" + (i === SEL ? " sel" : "")); b.type = "button";
    b.appendChild(el("b", "", "/" + c.name + (c.arguments || []).map(x => " " + (x.required ? x.name : "[" + x.name + "]")).join("")));
    if (c.description) b.appendChild(el("span", "", c.description));
    b.onmousedown = ev => ev.preventDefault();
    b.onclick = () => pickCmd(c); box.appendChild(b); i++;
  };
  box.appendChild(el("div", "grp", "Befehle des Assistenten"));
  if (m.prompts.length) m.prompts.forEach(item);
  else box.appendChild(el("div", "muted grp", !a ? "Kein Assistent gewählt." :
    !a.commands ? "Dieser Assistent bietet keine /Befehle an." :
    !C ? "Die Befehle des Assistenten gibt es, sobald das Gespräch läuft." :
    CMDSAID || (CMDS.length ? "Kein Befehl passt." : "Die Sicht dieses Assistenten hat keine Prompts.")));
  if (m.own.length) { box.appendChild(el("div", "grp", "Chat")); m.own.forEach(item); }
}

$("new").onclick = () => startDraft($("pick").value);
$("pick").onchange = () => { if (!C) { render(); showCommands(); } };
$("q").addEventListener("input", renderSide);

// ---- Eingabe: wächst mit dem Text, Enter sendet, Umschalt+Enter macht eine neue Zeile
function grow(){ const t = $("t"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight + 2, 192) + "px"; }
$("f").onsubmit = async ev => {
  ev.preventDefault();
  const text = $("t").value.trim(); if (!text || busy) return;
  const own = text.startsWith("/") && !/\s/.test(text) ? ownCmd(text.slice(1)) : null;
  if (own) { $("t").value = ""; grow(); showCommands(); own.run(); return; }
  $("t").value = ""; grow(); showCommands();
  PENDING = text;
  if (!C || !C.id) {
    setBusy(true, "Gespräch wird angelegt …");
    const r = await api("POST", "api/conv", {assistant: $("pick").value});
    if (r.error) { PENDING = null; busy = false; $("go").disabled = false; $("t").disabled = false;
      $("t").value = text; grow(); render(el("div", "err", r.error)); return; }
    C = r; loadCommands();
  }
  await drive("api/conv/" + C.id + "/send", {text}, "Das Modell denkt …");
};
$("t").addEventListener("keydown", ev => {
  const m = cmdMatches(), all = m ? m.prompts.concat(m.own) : [];
  if (all.length && (ev.key === "ArrowDown" || ev.key === "ArrowUp")) {
    ev.preventDefault(); SEL = (SEL + (ev.key === "ArrowDown" ? 1 : all.length - 1)) % all.length; showCommands(); return;
  }
  if (all.length && (ev.key === "Tab" || (ev.key === "Enter" && !ev.shiftKey))) { ev.preventDefault(); pickCmd(all[SEL]); return; }
  if (m && ev.key === "Escape") { $("t").value = ""; showCommands(); return; }
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("f").requestSubmit(); }
});
$("t").addEventListener("input", () => { SEL = 0; grow(); showCommands(); });

// ---- Einstellungen
for (const seg of document.querySelectorAll("#setdlg .seg"))
  seg.addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) setOne(seg.dataset.k, b.dataset.v); });
const openSettings = () => { applySet(); closeDrawer(); $("setdlg").showModal(); };
$("nset").onclick = openSettings; $("mset").onclick = openSettings;
$("setclose").onclick = () => $("setdlg").close();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (SET.theme === "system") rethemeMermaid(); });

// ---- Assistenten: eigene Seite mit Suche, Filter und „Neuer Assistent“
const F = $("af");
function fill(a){
  F.reset(); $("aerr").textContent = "";
  F.elements.id.readOnly = !!a;
  $("dtitle").textContent = a ? "Assistent ändern" : "Neuer Assistent";
  if (!a) return;
  for (const k of ["id", "title", "greeting", "system", "model", "view", "gateway"]) F.elements[k].value = a[k] || "";
  F.elements.scope.value = a.visibility.scope;
  F.elements.team.value = (a.visibility.context || {}).team || "";
  F.elements.commands.checked = !!a.commands;
  F.elements.views.checked = !!a.views;
}
function renderAssistants(){
  const box = $("alist"); box.textContent = "";
  const q = $("aq").value.trim().toLowerCase(), f = $("ascope").value;
  const list = S.assistants.filter(a =>
    (!q || [a.title, a.id, a.view, a.model, a.greeting || ""].join(" ").toLowerCase().includes(q)) &&
    (f === "all" || (f === "mine" ? a.manage : a.visibility.scope === f)));
  for (const a of list) {
    const card = el("div", "acard");
    card.appendChild(el("h3", "", a.title));
    const tags = el("div");
    for (const t of [scopeWord(a), a.origin === "config" ? "aus der Konfiguration" : "", a.views ? "Ansichten" : "", a.commands ? "/Befehle" : ""])
      if (t) tags.appendChild(el("span", "badge", t));
    card.appendChild(tags);
    const g = (a.greeting || "").replace(/[*_`#>\[\]]/g, "");
    if (g) card.appendChild(el("p", "", g.length > 140 ? g.slice(0, 140) + " …" : g));
    card.appendChild(el("p", "", a.id + " · Modell " + a.model + " · Sicht " + a.view));
    const acts = el("div", "acts");
    const go = el("button", "primary", "Gespräch beginnen"); go.type = "button";
    go.onclick = () => startDraft(a.id); acts.appendChild(go);
    if (a.manage) {
      const e = el("button", "", "Ändern"); e.type = "button";
      e.onclick = async () => { fill(await api("GET", "api/assistants/" + a.id)); $("dlg").showModal(); };
      const d = el("button", "", "Löschen"); d.type = "button";
      d.onclick = async () => { if (!confirm("Assistent " + a.title + " löschen?")) return;
        const r = await api("POST", "api/assistants/" + a.id + "/delete", {});
        $("alisterr").textContent = (r.errors || []).join(" ") || r.error || ""; await refreshState(); };
      acts.append(e, d);
    }
    card.appendChild(acts); box.appendChild(card);
  }
  if (!list.length) box.appendChild(el("p", "muted", S.assistants.length ? "Kein Assistent passt." : "Noch kein Assistent. Lege mit „Neuer Assistent“ einen an."));
  if (!S.teams_known) box.appendChild(el("p", "muted", "Deine Team-Berechtigungen sind gerade nicht lesbar — Team-Assistenten fehlen in der Liste."));
}
$("manage").onclick = async () => { closeDrawer(); showView("asst"); await refreshState(); };
$("aq").addEventListener("input", renderAssistants);
$("ascope").onchange = renderAssistants;
$("anewbtn").onclick = () => { fill(null); $("dlg").showModal(); };
$("dclose").onclick = () => $("dlg").close();
F.onsubmit = async ev => {
  ev.preventDefault();
  const v = {scope: F.elements.scope.value};
  if (v.scope === "context") v.context = {team: F.elements.team.value.trim()};
  const a = {id: F.elements.id.value.trim(), title: F.elements.title.value.trim(), system: F.elements.system.value,
             model: F.elements.model.value.trim(), view: F.elements.view.value.trim(), visibility: v,
             owner: "-", commands: F.elements.commands.checked, views: F.elements.views.checked};
  if (F.elements.greeting.value.trim()) a.greeting = F.elements.greeting.value.trim();
  if (F.elements.gateway.value.trim()) a.gateway = F.elements.gateway.value.trim();
  const r = await api("POST", "api/assistants", a);
  if (r.errors || r.error) { $("aerr").textContent = r.errors ? r.errors.join(" ") : r.error; return; }
  $("dlg").close(); $("alisterr").textContent = "„" + a.title + "“ gespeichert.";
  await refreshState();
};
$("aimp").onchange = async ev => {
  const f = ev.target.files[0]; if (!f) return;
  let doc; try { doc = JSON.parse(await f.text()); } catch (e) { $("alisterr").textContent = "Die Datei ist kein JSON."; return; }
  const r = await api("POST", "api/assistants/import", doc);
  $("alisterr").textContent = r.errors ? r.errors.join(" ") : (r.error || r.imported + " importiert.");
  ev.target.value = ""; await refreshState();
};

(async () => {
  await refreshState();
  if (S.error) { $("log").appendChild(el("div", "err", S.error)); return; }
  $("who").textContent = (S.user || "") + " · Chat " + S.version;
  if (location.hash === "#assistenten") showView("asst");
  else if (S.conversations.length) await openConv(S.conversations[0].id); else startDraft();
  // Fehlt dem Chat ein Teil, zeigt er gleich, welches -- statt erst beim ersten Senden.
  if ((!S.client || !S.model) && (C || S.assistants.length)) checkSetup(C ? C.assistant : S.assistants[0].id);
  for (const e of S.errors || []) $("log").appendChild(el("div", "err", e));
})();
</script>
</body>
</html>
