<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--me:#e8f0fe;
--accent:#1d4ed8;--warn:#92400e;--warnbg:#fef3c7;--err:#b91c1c;--tool:#f3f4f6}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--panel:#1f2937;--ink:#e5e7eb;--muted:#9ca3af;
--line:#374151;--me:#1e3a8a;--accent:#93c5fd;--warn:#fcd34d;--warnbg:#422006;--err:#fca5a5;--tool:#111827}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex}
aside{width:17rem;border-right:1px solid var(--line);background:var(--panel);display:flex;
flex-direction:column;padding:.8rem;gap:.5rem;overflow-y:auto}
aside h1{font-size:1.05rem;margin:.2rem 0 .4rem}
.conv{display:block;width:100%;text-align:left;padding:.45rem .5rem;border:0;border-radius:.4rem;
background:none;color:var(--ink);cursor:pointer;font:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv.on,.conv:hover{background:var(--me)}
.conv small{color:var(--muted)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:.7rem 1rem;border-bottom:1px solid var(--line);background:var(--panel)}
header .muted{font-size:.85rem}
#log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.msg{max-width:46rem;padding:.6rem .8rem;border-radius:.6rem;white-space:pre-wrap;word-break:break-word;line-height:1.45}
.user{align-self:flex-end;background:var(--me)}
.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line);white-space:normal}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:.45rem 0}.md h3,.md h4,.md h5,.md h6{margin:.7rem 0 .35rem;font-size:1rem}
.md ul,.md ol{margin:.35rem 0;padding-left:1.4rem}
.md code{background:var(--tool);border-radius:.25rem;padding:.05rem .3rem;font-size:.88em}
.md pre{background:var(--tool);border-radius:.4rem;padding:.6rem;overflow-x:auto;white-space:pre}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;margin:.4rem 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:.25rem .5rem;text-align:left;vertical-align:top}
.md blockquote{margin:.4rem 0;padding-left:.7rem;border-left:3px solid var(--line);color:var(--muted)}
.md a{color:var(--accent)} .md hr{border:0;border-top:1px solid var(--line)}
.mermaid-src svg{max-width:100%;height:auto;background:#fff;border-radius:.3rem}
.setup{align-self:stretch;background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.7rem .9rem}
.setup li{margin:.35rem 0;list-style:none}.setup ul{padding:0;margin:.3rem 0}
.setup .next{color:var(--muted);font-size:.88rem;display:block}
.hbtn{font-size:.8rem;padding:.2rem .55rem;margin-left:.3rem}
.cmd{font-size:.8rem;color:var(--muted);display:block;margin-bottom:.2rem}
.call,.result{align-self:flex-start;font-size:.85rem;color:var(--muted);background:var(--tool);
border-radius:.4rem;padding:.35rem .6rem;max-width:46rem}
.result summary{cursor:pointer}
.result pre{white-space:pre-wrap;margin:.4rem 0 0;font-size:.82rem}
.confirm{align-self:flex-start;background:var(--warnbg);color:var(--warn);border-radius:.6rem;padding:.7rem .9rem;max-width:46rem}
.confirm pre{white-space:pre-wrap;color:var(--ink);background:var(--panel);padding:.5rem;border-radius:.3rem}
.err{color:var(--err)} .muted{color:var(--muted)}
#cmds{font-size:.85rem;color:var(--muted);padding:0 1rem .3rem;background:var(--panel)}
#cmds button{font-size:.8rem;padding:.15rem .5rem;margin:.15rem .2rem 0 0}
form.send{display:flex;gap:.5rem;padding:.8rem 1rem;border-top:1px solid var(--line);background:var(--panel)}
textarea,input,select{font:inherit;padding:.45rem;border:1px solid var(--line);border-radius:.4rem;background:var(--bg);color:var(--ink)}
form.send textarea{flex:1;resize:none}
button{font:inherit;padding:.45rem .9rem;border-radius:.4rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
dialog{border:1px solid var(--line);border-radius:.6rem;background:var(--panel);color:var(--ink);width:min(40rem,calc(100vw - 2rem));max-height:90vh}
dialog label{display:block;font-size:.85rem;margin:.6rem 0 .2rem;color:var(--muted)}
dialog input,dialog textarea,dialog select{width:100%}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.alist div{display:flex;justify-content:space-between;gap:.5rem;padding:.35rem 0;border-bottom:1px solid var(--line)}
@media (max-width:700px){body{flex-direction:column;height:auto;min-height:100vh}
aside{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:35vh}#log{min-height:50vh}}
</style>
</head>
<body>
<aside>
  <h1>Chat</h1>
  <select id="pick" aria-label="Assistent für ein neues Gespräch"></select>
  <button id="new" class="primary">Neues Gespräch</button>
  <button id="manage">Assistenten …</button>
  <div id="convs"></div>
  <div class="muted" style="margin-top:auto;font-size:.8rem" id="who"></div>
</aside>
<main>
  <header><b id="ctitle">—</b> <span class="muted" id="cassist"></span>
  <span style="float:right"><button class="hbtn" id="ren" type="button">Umbenennen</button><button class="hbtn" id="del" type="button">Löschen</button><button class="hbtn" id="chk" type="button">Einrichtung prüfen</button></span>
  <div class="muted">Jede Runde läuft als du: der Assistent sieht nur, was du sehen darfst.
  Was etwas ändert, läuft erst nach deiner Zustimmung.</div></header>
  <div id="log"></div>
  <div id="cmds"></div>
  <form id="f" class="send"><textarea id="t" rows="2" placeholder="Nachricht … (/ für Befehle)" maxlength="4000"></textarea>
  <button class="primary" id="go">Senden</button></form>
</main>

<dialog id="dlg">
  <div class="row" style="justify-content:space-between"><b>Assistenten</b>
    <button id="dclose" type="button">Schließen</button></div>
  <div class="alist" id="alist"></div>
  <form id="af">
    <label>Kennung (Kleinbuchstaben, Ziffern, Bindestrich)</label><input name="id" required pattern="[a-z0-9][a-z0-9-]{0,47}">
    <label>Titel</label><input name="title" required maxlength="80">
    <label>Begrüßung</label><input name="greeting" maxlength="500">
    <label>Anweisung an das Modell (Systemprompt)</label><textarea name="system" rows="5" required maxlength="8000"></textarea>
    <div class="row">
      <div style="flex:1"><label>Modellname des KI-Gateways</label><input name="model" value="standard" required></div>
      <div style="flex:1"><label>Sicht des MCP-Gateways</label><input name="view" required></div>
      <div style="flex:1"><label>Gateway (leer = das einzige)</label><input name="gateway"></div>
    </div>
    <div class="row">
      <div style="flex:1"><label>Wer sieht ihn?</label><select name="scope">
        <option value="private">nur ich</option><option value="context">ein Team</option>
        <option value="tenant">alle im Mandanten</option></select></div>
      <div style="flex:1"><label>Team (bei „ein Team“)</label><input name="team"></div>
    </div>
    <label><input type="checkbox" name="commands" style="width:auto"> /Befehle aus den Prompts der Sicht anbieten</label>
    <label><input type="checkbox" name="views" style="width:auto"> Ansichten der Werkzeuge zeigen (MCP Apps)</label>
    <p class="err" id="aerr"></p>
    <div class="row"><button class="primary">Speichern</button><button type="button" id="anew">Leeren</button>
      <a id="aexp" href="api/assistants/export" download="assistenten.json">Exportieren</a>
      <label style="margin:0">Importieren <input type="file" id="aimp" accept="application/json" style="width:auto"></label></div>
  </form>
</dialog>

<script src="static/markdown.js"></script>
<script>
"use strict";
let S = null, C = null, busy = false, CMDS = [], SETUP = null;
// Mermaid nur laden, wenn eine Antwort ein Diagramm hat; jedes Diagramm nur einmal zeichnen.
const SVG = new Map();
let mermaidReady = null;
function loadMermaid(){
  if (!mermaidReady) mermaidReady = new Promise((ok, no) => {
    const sc = document.createElement("script"); sc.src = "static/mermaid.min.js";
    sc.onload = () => { const dark = matchMedia("(prefers-color-scheme: dark)").matches;
      window.mermaid.initialize({startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "default"}); ok(); };
    sc.onerror = no; document.head.appendChild(sc);
  });
  return mermaidReady;
}
async function drawMermaid(root){
  const boxes = root.querySelectorAll(".mermaid-src");
  if (!boxes.length) return;
  for (const b of boxes) { const src = b.dataset.src; if (SVG.has(src)) b.innerHTML = SVG.get(src); }
  const todo = [...boxes].filter(b => !SVG.has(b.dataset.src));
  if (!todo.length) return;
  try { await loadMermaid(); } catch (e) { return; }
  let n = 0;
  for (const b of todo) {
    const src = b.dataset.src;
    try { const out = await window.mermaid.render("mmd" + Date.now() + (n++), src); SVG.set(src, out.svg); b.innerHTML = out.svg; }
    catch (e) { SVG.set(src, b.innerHTML + '<div class="muted">Diagramm nicht lesbar — oben der Quelltext.</div>');
                b.innerHTML = SVG.get(src); }
  }
}
function mdEl(text){ const d = el("div", "msg assistant md"); d.innerHTML = window.ChatMarkdown.render(text); return d; }
const $ = id => document.getElementById(id);
function el(tag, cls, text){const e=document.createElement(tag); if(cls) e.className=cls;
  if(text!==undefined) e.textContent=text; return e;}
async function api(method, path, body){
  const r = await fetch(path, {method, headers: {"Content-Type": "application/json"},
                               body: body === undefined ? undefined : JSON.stringify(body)});
  let doc = {};
  try { doc = await r.json(); } catch (e) { doc = {error: "Antwort " + r.status + " ohne JSON."}; }
  if (!r.ok && !doc.error && !doc.errors) doc.error = "Antwort " + r.status;
  return doc;
}
const assistant = id => (S.assistants || []).find(a => a.id === id);
const scopeWord = a => a.visibility.scope === "private" ? "privat" :
  a.visibility.scope === "tenant" ? "Mandant" : "Team " + a.visibility.context.team;

function renderSide(){
  const pick = $("pick"); const was = pick.value; pick.textContent = "";
  for (const a of S.assistants) { const o = el("option", "", a.title + " · " + scopeWord(a)); o.value = a.id; pick.appendChild(o); }
  if (was && assistant(was)) pick.value = was;
  $("new").disabled = !S.assistants.length;
  const box = $("convs"); box.textContent = "";
  for (const c of S.conversations) {
    const a = assistant(c.assistant);
    const b = el("button", "conv" + (C && C.id === c.id ? " on" : ""), c.title + " ");
    b.appendChild(el("small", "", a ? a.title : "(Assistent nicht verfügbar)"));
    b.onclick = () => openConv(c.id); box.appendChild(b);
  }
}

// Neu zeichnen, ohne Ansichten neu zu laden: Nachrichten werden nur angehängt, solange
// es dasselbe Gespräch ist (ein iframe, das man umhängt, lädt neu).
let SHOWN = {id: null, n: 0};
function msgNodes(m){
  const out = [];
  if (m.role === "user") {
    const d = el("div", "msg user");
    if (m.command) d.appendChild(el("span", "cmd", "/" + m.command));
    d.appendChild(document.createTextNode(m.content)); out.push(d);
  } else if (m.role === "assistant" && m.content) {
    out.push(mdEl(m.content));
  }
  for (const c of m.calls || []) out.push(el("div", "call", "Werkzeug " + c.name + " " + JSON.stringify(c.arguments || {})));
  if (m.role === "tool") {
    const d = el("details", "result");
    d.appendChild(el("summary", "", "Ergebnis " + (m.name || "") + (m.confirmed === true ? " · von dir freigegeben" :
                                                             m.confirmed === false ? " · von dir abgelehnt" : "")));
    d.appendChild(el("pre", "", m.content)); out.push(d);
    const a = C ? assistant(C.assistant) : null;
    if (m.view && a && a.views) out.push(viewFrame(m));
  }
  return out;
}

function render(status){
  const log = $("log");
  const a = C ? assistant(C.assistant) : null;
  $("ctitle").textContent = C ? C.title : "—";
  $("cassist").textContent = a ? "mit " + a.title : (C ? "Assistent nicht verfügbar" : "");
  let head = $("loghead"), msgs = $("logmsgs"), tail = $("logtail");
  if (!head) {
    log.textContent = "";
    head = el("div"); head.id = "loghead"; msgs = el("div"); msgs.id = "logmsgs"; tail = el("div"); tail.id = "logtail";
    for (const x of [head, msgs, tail]) { x.style.display = "flex"; x.style.flexDirection = "column"; x.style.gap = ".6rem"; log.appendChild(x); }
  }
  head.textContent = "";
  if (a && a.greeting) head.appendChild(mdEl(a.greeting));
  if (SETUP && C && SETUP.assistant === C.assistant) head.appendChild(setupBox(SETUP));
  if (!C) { msgs.textContent = ""; tail.textContent = ""; SHOWN = {id: null, n: 0}; return; }
  if (SHOWN.id !== C.id || C.messages.length < SHOWN.n) { msgs.textContent = ""; SHOWN = {id: C.id, n: 0}; dropFrames(); }
  for (const m of C.messages.slice(SHOWN.n)) for (const node of msgNodes(m)) msgs.appendChild(node);
  SHOWN.n = C.messages.length;
  tail.textContent = "";
  if (C.confirm && !busy) {
    const k = C.confirm, box = el("div", "confirm");
    box.appendChild(el("div", "", "Der Assistent möchte etwas " + (k.effect === "execute" ? "ausführen" : "ändern") + " — als du:"));
    box.appendChild(el("pre", "", k.name + " " + JSON.stringify(k.arguments, null, 2)));
    const ok = el("button", "primary", "Ausführen"), no = el("button", "", "Ablehnen");
    ok.onclick = () => decide(k.call, true); no.onclick = () => decide(k.call, false);
    box.append(ok, " ", no); tail.appendChild(box);
  }
  if (status) tail.appendChild(status);
  log.scrollTop = log.scrollHeight;
  drawMermaid(msgs).then(() => { log.scrollTop = log.scrollHeight; });
}

// ---- Ansichten von MCP Apps (RFC-0075): der Chat ist der Host. Die Ansicht läuft im
// Sandbox-Proxy auf der zweiten Herkunft dieser Instanz; jede Nachricht wird hier
// geprüft, Aufrufe gehen durch die Türen des Chats -- als du, schreibend nur nach Zustimmung.
const FRAMES = [];
function sandboxOrigin(){
  const list = (S && S.sandbox_origins) || [];
  const rest = location.host.split(".").slice(1).join(".");
  return list.find(o => o.split("://")[1].split(".").slice(1).join(".") === rest) || list[0] || "";
}
function dropFrames(){ FRAMES.length = 0; }
function viewFrame(m){
  const box = el("div", "view");
  const origin = sandboxOrigin();
  if (!origin) { box.appendChild(el("div", "muted", "Ansicht nicht verfügbar: dieser Chat hat keine zweite Herkunft (Plattform ab 0.1.245).")); return box; }
  const f = document.createElement("iframe");
  f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms");
  f.setAttribute("title", "Ansicht " + (m.name || ""));
  f.style.cssText = "width:100%;height:120px;border:1px solid var(--line);border-radius:.5rem;background:var(--panel)";
  f.src = origin + "/ui-sandbox";
  box.appendChild(f);
  FRAMES.push({frame: f, origin, conv: C.id, call: m.tool_call_id, name: m.name, doc: null, ready: false});
  return box;
}
function toView(st, msg){ st.frame.contentWindow.postMessage(msg, st.origin); }
function reply(st, id, result){ toView(st, {jsonrpc: "2.0", id, result}); }
function fail(st, id, code, message){ toView(st, {jsonrpc: "2.0", id, error: {code, message}}); }

async function viewCall(st, body){
  let r = await api("POST", "api/conv/" + st.conv + "/view-call", body);
  if (r.confirm) {
    const k = r.confirm;
    // D4: die Zustimmung fragt der Chat selbst -- nicht die Ansicht.
    const yes = confirm("Die Ansicht von " + st.name + " möchte etwas " + (k.effect === "execute" ? "ausführen" : "ändern") +
                        " — als du:\n\n" + k.name + " " + JSON.stringify(k.arguments, null, 2) + "\n\nAusführen?");
    if (!yes) return {error: "Von dir abgelehnt."};
    r = await api("POST", "api/conv/" + st.conv + "/view-call", Object.assign({}, body, {confirmed: true}));
  }
  return r;
}

window.addEventListener("message", async ev => {
  const st = FRAMES.find(x => x.frame.contentWindow === ev.source);
  if (!st || ev.origin !== st.origin) return;
  const m = ev.data;
  if (!m || m.jsonrpc !== "2.0") return;
  if (m.method === "ui/notifications/sandbox-proxy-ready") {
    const doc = await api("GET", "api/conv/" + st.conv + "/view?call=" + encodeURIComponent(st.call));
    if (doc.error) { st.frame.replaceWith(el("div", "err", "Ansicht: " + doc.error)); return; }
    st.doc = doc;
    toView(st, {jsonrpc: "2.0", method: "ui/notifications/sandbox-resource-ready",
                params: {html: doc.html, csp: {}, permissions: {}}});
    return;
  }
  if (m.method === "ui/notifications/initialized" && st.doc && !st.ready) {
    st.ready = true;
    toView(st, {jsonrpc: "2.0", method: "ui/notifications/tool-input", params: {arguments: st.doc.arguments || {}}});
    toView(st, {jsonrpc: "2.0", method: "ui/notifications/tool-result", params: st.doc.result || {}});
    return;
  }
  if (m.method === "ui/notifications/size-changed" && m.params) {
    st.frame.style.height = Math.min(Math.max(Number(m.params.height) || 0, 60), 900) + 2 + "px";
    return;
  }
  if (m.id === undefined || typeof m.method !== "string") return;
  const p = m.params || {};
  if (m.method === "ui/initialize") {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    return reply(st, m.id, {protocolVersion: "2026-01-26",
      hostCapabilities: {openLinks: {}, serverTools: {}, serverResources: {}},
      hostInfo: {name: "oaap-chat", version: (S && S.version) || ""},
      hostContext: {toolInfo: {tool: {name: st.name}}, theme: dark ? "dark" : "light",
                    displayMode: "inline", availableDisplayModes: ["inline"], locale: "de-DE"}});
  }
  if (m.method === "ping") return reply(st, m.id, {});
  if (m.method === "tools/call") {
    const r = await viewCall(st, {name: p.name, arguments: p.arguments || {}});
    return r.error ? fail(st, m.id, -32000, r.error) : reply(st, m.id, r.result);
  }
  if (m.method === "resources/read") {
    const r = await api("POST", "api/conv/" + st.conv + "/view-call", {method: "resources/read", uri: p.uri});
    return r.error ? fail(st, m.id, -32000, r.error) : reply(st, m.id, r.result);
  }
  if (m.method === "ui/open-link") {
    if (!/^https?:\/\//i.test(String(p.url || ""))) return fail(st, m.id, -32000, "Invalid URL");
    window.open(p.url, "_blank", "noopener,noreferrer");
    return reply(st, m.id, {});
  }
  if (m.method === "ui/message") {
    // D5: der Vorschlag landet im Eingabefeld -- gesendet wird nur von dir.
    const text = ((p.content || {}).text || "").slice(0, 4000);
    if (text) { $("t").value = text; $("t").focus(); }
    return reply(st, m.id, {});
  }
  if (m.method === "ui/request-display-mode") return reply(st, m.id, {mode: "inline"});
  return fail(st, m.id, -32601, "Dieser Chat kann " + m.method + " noch nicht.");
});

// „Einrichtung prüfen“: was fehlt, und der nächste Schritt
function setupBox(r){
  const box = el("div", "setup"), ok = r.items.every(i => i.ok);
  box.appendChild(el("b", "", ok ? "Einrichtung: alles da." : "Einrichtung: es fehlt noch etwas."));
  const ul = el("ul");
  for (const i of r.items) {
    const li = el("li", i.ok ? "" : "err", (i.ok ? "✓ " : "✗ ") + i.title + (i.detail ? " — " + i.detail : ""));
    if (i.next) li.appendChild(el("span", "next", "Nächster Schritt: " + i.next));
    ul.appendChild(li);
  }
  box.appendChild(ul);
  const close = el("button", "hbtn", "Ausblenden"); close.type = "button";
  close.onclick = () => { SETUP = null; render(); }; box.appendChild(close);
  return box;
}
async function checkSetup(aid){
  if (!aid) return;
  SETUP = {assistant: aid, items: [{ok: true, title: "Prüfe …", detail: "", next: ""}]}; render();
  const r = await api("GET", "api/setup?assistant=" + encodeURIComponent(aid));
  SETUP = r.items ? r : {assistant: aid, items: [{ok: false, title: "Prüfung", detail: r.error || "fehlgeschlagen", next: ""}]};
  render();
}

function setBusy(b, text){ busy = b; $("go").disabled = b; $("t").disabled = b; render(b ? el("div", "muted", text) : null); }

// D7: der Browser treibt die Schleife -- jede Runde eine eigene Anfrage.
async function drive(path, body, text){
  setBusy(true, text);
  let doc = await api("POST", path, body);
  while (doc.state === "more") {
    C = doc; setBusy(true, "Werkzeug läuft, danach denkt das Modell …");
    doc = await api("POST", "api/conv/" + C.id + "/step", {});
  }
  if (doc.messages) C = doc;
  busy = false; $("go").disabled = false; $("t").disabled = false;
  let status = null;
  if (doc.state === "error" || doc.error) {
    status = el("div", "err", doc.said || doc.error);
    if (doc.state === "error") {
      const again = el("button", "", "Erneut versuchen");
      again.onclick = () => drive("api/conv/" + C.id + "/step", {}, "Erneuter Versuch …");
      status.append(" ", again);
    }
  }
  render(status);
  await refreshState();
}
function decide(call, ok){
  drive("api/conv/" + C.id + "/step", {decision: {call, ok}}, ok ? "Werkzeug läuft, danach denkt das Modell …" : "Das Modell denkt …");
}

async function loadCommands(){
  CMDS = []; $("cmds").textContent = "";
  const a = C ? assistant(C.assistant) : null;
  if (!a || !a.commands) return;
  const r = await api("GET", "api/conv/" + C.id + "/commands");
  CMDS = r.commands || [];
  if (r.said) $("cmds").textContent = r.said;
  showCommands();
}
function showCommands(){
  const box = $("cmds"), t = $("t").value; box.textContent = "";
  if (!t.startsWith("/") || !CMDS.length) return;
  for (const c of CMDS.filter(c => ("/" + c.name).startsWith(t.split(/\s/)[0]))) {
    const b = el("button", "", "/" + c.name + c.arguments.map(x => " " + (x.required ? x.name : "[" + x.name + "]")).join(""));
    b.title = c.description; b.type = "button";
    b.onclick = () => { $("t").value = "/" + c.name + " "; $("t").focus(); showCommands(); };
    box.appendChild(b);
  }
}

async function refreshState(){ S = await api("GET", "api/state"); renderSide(); }
async function openConv(id){ C = await api("GET", "api/conv/" + id); SHOWN = {id: null, n: 0}; render(); renderSide(); loadCommands(); }

$("chk").onclick = () => checkSetup(C ? C.assistant : $("pick").value);
$("ren").onclick = async () => {
  if (!C) return;
  const t = prompt("Neuer Titel für dieses Gespräch:", C.title); if (!t) return;
  const r = await api("POST", "api/conv/" + C.id + "/rename", {title: t});
  if (r.error) { render(el("div", "err", r.error)); return; }
  C = r; await refreshState(); render();
};
$("del").onclick = async () => {
  if (!C || !confirm("Gespräch „" + C.title + "“ löschen? Das lässt sich nicht rückgängig machen.")) return;
  const r = await api("POST", "api/conv/" + C.id + "/delete", {});
  if (r.error) { render(el("div", "err", r.error)); return; }
  C = null; SETUP = null; await refreshState();
  if (S.conversations.length) await openConv(S.conversations[0].id); else render();
};
$("new").onclick = async () => {
  const r = await api("POST", "api/conv", {assistant: $("pick").value});
  if (r.error) { render(el("div", "err", r.error)); return; }
  C = r; await refreshState(); render(); loadCommands();
};
$("f").onsubmit = async ev => {
  ev.preventDefault();
  const text = $("t").value.trim(); if (!text || busy) return;
  if (!C || !C.id) { const r = await api("POST", "api/conv", {assistant: $("pick").value});
    if (r.error) { render(el("div", "err", r.error)); return; } C = r; loadCommands(); }
  $("t").value = ""; showCommands();
  await drive("api/conv/" + C.id + "/send", {text}, "Das Modell denkt …");
};
$("t").addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("f").requestSubmit(); } });
$("t").addEventListener("input", showCommands);

// ---- Assistenten pflegen
const F = $("af");
function fill(a){
  F.reset(); $("aerr").textContent = "";
  if (!a) return;
  for (const k of ["id", "title", "greeting", "system", "model", "view", "gateway"]) F.elements[k].value = a[k] || "";
  F.elements.scope.value = a.visibility.scope;
  F.elements.team.value = (a.visibility.context || {}).team || "";
  F.elements.commands.checked = !!a.commands;
  F.elements.views.checked = !!a.views;
}
async function renderList(){
  const box = $("alist"); box.textContent = "";
  for (const a of S.assistants) {
    const row = el("div"); row.appendChild(el("span", "", a.title + " (" + a.id + ") · " + scopeWord(a) +
      (a.origin === "config" ? " · aus der Konfiguration" : "")));
    const acts = el("span");
    if (a.manage) {
      const e = el("button", "", "Ändern"); e.type = "button";
      e.onclick = async () => fill(await api("GET", "api/assistants/" + a.id));
      const d = el("button", "", "Löschen"); d.type = "button";
      d.onclick = async () => { if (!confirm("Assistent " + a.title + " löschen?")) return;
        const r = await api("POST", "api/assistants/" + a.id + "/delete", {});
        $("aerr").textContent = (r.errors || []).join(" "); await refreshState(); renderList(); };
      acts.append(e, " ", d);
    }
    row.appendChild(acts); box.appendChild(row);
  }
  if (!S.teams_known) box.appendChild(el("p", "muted", "Deine Team-Berechtigungen sind gerade nicht lesbar — Team-Assistenten fehlen in der Liste."));
}
$("manage").onclick = async () => { await refreshState(); fill(null); renderList(); $("dlg").showModal(); };
$("dclose").onclick = () => $("dlg").close();
$("anew").onclick = () => fill(null);
F.onsubmit = async ev => {
  ev.preventDefault();
  const v = {scope: F.elements.scope.value};
  if (v.scope === "context") v.context = {team: F.elements.team.value.trim()};
  const a = {id: F.elements.id.value.trim(), title: F.elements.title.value.trim(), system: F.elements.system.value,
             model: F.elements.model.value.trim(), view: F.elements.view.value.trim(), visibility: v,
             owner: "-", commands: F.elements.commands.checked, views: F.elements.views.checked};
  if (F.elements.greeting.value.trim()) a.greeting = F.elements.greeting.value.trim();
  if (F.elements.gateway.value.trim()) a.gateway = F.elements.gateway.value.trim();
  const r = await api("POST", "api/assistants", a);
  $("aerr").textContent = r.errors ? r.errors.join(" ") : (r.error || "Gespeichert.");
  await refreshState(); renderList();
};
$("aimp").onchange = async ev => {
  const f = ev.target.files[0]; if (!f) return;
  let doc; try { doc = JSON.parse(await f.text()); } catch (e) { $("aerr").textContent = "Die Datei ist kein JSON."; return; }
  const r = await api("POST", "api/assistants/import", doc);
  $("aerr").textContent = r.errors ? r.errors.join(" ") : (r.error || r.imported + " importiert.");
  ev.target.value = ""; await refreshState(); renderList();
};

(async () => {
  await refreshState();
  if (S.error) { $("log").appendChild(el("div", "err", S.error)); return; }
  $("who").textContent = (S.user || "") + " · Chat " + S.version;
  if (S.conversations.length) await openConv(S.conversations[0].id); else render();
  // Fehlt dem Chat ein Teil, zeigt er gleich, welches -- statt erst beim ersten Senden.
  if ((!S.client || !S.model) && (C || S.assistants.length)) checkSetup(C ? C.assistant : S.assistants[0].id);
  for (const e of S.errors || []) $("log").appendChild(el("div", "err", e));
  if (!S.assistants.length) $("log").appendChild(el("div", "muted", "Für dich ist noch kein Assistent sichtbar. Lege unter „Assistenten …“ einen eigenen an."));
})();
</script>
</body>
