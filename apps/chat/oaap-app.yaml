oaap_manifest: "0.18"

app:
  id: chat
  name: Chat
  version: 0.19.0
  type: native
  class: frontend
  description: "Der Plattform-Chat, erste Fassung (RFC-0074 Stufe 2): ein Assistent (oaap.ai.assistants 0.1) mit den Werkzeugen einer Sicht des MCP-Gateways und einem Modell des KI-Gateways. Jeder Werkzeugaufruf laeuft als die Person, die schreibt (Verfahren A); was etwas aendert, erst nach ihrer Zustimmung. Verlauf je Person unter /data. Seit 0.17.0 ist die Leiste ein Baum mit Obergruppen und Symbolen: Kalender (Jahr, Monat, sobald es Gespraeche gibt) ueber Assistenten; ein neues Gespraech beginnt man auf der Karte eines Assistenten (oder /neu), schmal zeigt die Assistenten-Seite nur Suche und Neues Gespraech; Vorgaenge stehen ueber Einstellungen. Dazu Favicon, Symbole fuer den Homescreen (Web-App-Manifest) und CHAT_TITLE als Name im Reiter und auf dem Homescreen. Seit 0.16.0 erreicht der Chat das KI-Gateway seines Mandanten auch ohne Destination ki (RFC-0104, Manifest 0.18 ai_client): ueber eine via-Tuer der Plattform mit Client-Schluessel und der Zusicherung der Person; eine zugeordnete Destination ki geht weiter vor, bei mehreren KI-Gateways nennt CHAT_AI_GATEWAY eines, und Einrichtung pruefen nennt den Weg. Seit 0.9.0 liegen die Assistenten im MCP-Gateway, mit Revisionen (RFC-0097 Stufe 1, MCP-Gateway ab 0.22.0); die alte Datei uebernimmt ein tenant_admin mit einem Knopf, ein Gateway davor laesst alles wie bisher. Seit 0.8.0 Ampel je Gespraech (RFC-0101 Stufe 1): die Person waehlt gruen (sensible Daten, Vorgabe), gelb oder rot; der Chat nimmt nur Modelle und Sichten bis zu dieser Farbe und schickt sie als X-OAAP-Light an beide Gateways (KI-Gateway ab 0.9.0, MCP-Gateway ab 0.21.0), ohne gruenen Weg mit den Anfragen Gruene Option erbitten und Vorab fragen als Vorgang (App Vorgaenge). Seit 0.7.0 zeigt jede Assistenten-Karte, wie viele Werkzeuge fuer dich noch nicht eingerichtet sind, mit Link auf Meine Werkzeuge des Gateways, und Einrichtung pruefen nennt sie (MCP-Gateway ab 0.17.0, RFC-0095 Stufe 3). Seit 0.6.1 Suchhilfe fuer das Feld Sicht: nur die Sichten, die die Person aus diesem Chat oeffnen kann (Verwaltung: alle, mit Grund; MCP-Gateway ab 0.14.0). Seit 0.6.0 waehlt das Formular Assistent den Modellnamen aus der Liste, die der Schluessel der Destination ki erreicht (statt freiem Text), und Werkzeugaufrufe lassen sich in den Einstellungen ausblenden. Seit 0.5.2 nennt die Meldung ohne Zusicherung auch den fehlenden Schluessel des Knotens (oaap status). Seit 0.5.0 neues Layout: Leiste einklappbar (schmal als Schublade), Gespraeche durchsuchbar und gruppiert (Assistent/Zeit, einklappbar), Assistenten als eigene Seite mit Suche und Filter, Einstellungen (hell/dunkel, Hintergrund, Dichte, Schriftgroesse), Vollbild. Seit 0.4.1 eigene Frage sofort sichtbar, Denkanzeige, /-Suchliste mit Befehlen des Chats, Einrichtung pruefen als Dialog, Kopf- und Eingabezeile fest. Seit 0.4.0 Ansichten von MCP Apps (Sandbox-Proxy auf zweiter Herkunft, Plattform ab 0.1.245). Seit 0.3.0 Markdown und Mermaid in Antworten, Gespraeche umbenennen/loeschen, Einrichtung pruefen. Seit 0.2.0 mehrere Assistenten (privat, Team, Mandant), /Befehle aus den Prompts der Sicht, Zustimmung ans Gateway gemeldet. Plattform ab 0.1.243"

care:
  # RFC-0071 §15: nur Standardbibliothek, beim Bau wird nichts nachgeladen.
  rebuild: self

services:
  web:
    build: .
    port: 8000

routes:
  - path: /
    roles: [admin, keyuser, user]

storage:
  - name: data
    mount: /data

# RFC-0074 D5: der Chat handelt an den MCP-Gateways seines Mandanten als die
# Person, die mit ihm spricht. Der Schluessel dafuer oeffnet allein nichts --
# er braucht die Zusicherung der Person aus derselben Anfrage.
mcp_client:
  use: true

# RFC-0104 §4 (Manifest 0.18): dasselbe fuer das Modell. Ohne Destination ki ruft
# der Chat das KI-Gateway seines Mandanten ueber /platform/ai/via/<gateway>/ --
# mit OAAP_AI_CLIENT_KEY UND der Zusicherung der Person. Eine Destination ki geht vor.
ai_client:
  use: true

# Manifest 0.13 (RFC-0075 D6): die Seite des Sandbox-Proxys fuer Ansichten von MCP
# Apps. Die Plattform gibt ihr eine zweite Herkunft (<instanz>--ui...) ohne
# Anmeldung und ohne Kekse; einbetten darf sie nur der Chat selbst.
ui_sandbox:
  path: /ui-sandbox

# Das Modell: eine Destination auf ein KI-Gateway (der Schluessel bleibt auf
# der Plattform). Im geschlossenen Mandanten nur ein Schluessel mit Ampel gruen.
# RFC-0074 D4 ueber RFC-0045: wer einen Team-Assistenten sieht (use) und pflegt
# (manage). Der Mandant vergibt die Vorlagen in "Rollen & Rechte" mit dem Team
# als Kontext. Private Assistenten legt jede Person fuer sich an, solche fuer den
# ganzen Mandanten nur tenant_admin.
authorization:
  objects:
    - key: assistant
      title: Assistent
      activities: [use, manage]
      fields:
        - key: team
          context: Team
  role_templates:
    - key: assistant_user
      title: Assistenten des Teams benutzen
      grants:
        - object: assistant
          activities: [use]
          team: $context
    - key: assistant_keyuser
      title: Assistenten des Teams pflegen
      grants:
        - object: assistant
          activities: [use, manage]
          team: $context

destinations:
  - name: ki
    kind: http
    purpose: "Optional seit 0.16.0: KI-Gateway (OpenAI-Schnittstelle bis /v1) fuer die Modellzuege des Assistenten -- zugeordnet geht sie vor; ohne sie nimmt der Chat das KI-Gateway des Mandanten ueber die Plattform (ai_client)"

config:
  - key: CHAT_TITLE
    label: "Name dieses Chats: Titel im Browser-Reiter, Kopf der Leiste und Name unter dem Symbol auf dem Homescreen (hoechstens 40 Zeichen)"
    default: "Chat"
  - key: CHAT_ASSISTANT
    label: "Optional: ein Assistent fuer den ganzen Mandanten als JSON (oaap.ai.assistants 0.1), gepflegt nur hier; weitere legen die Leute im Chat an"
    default: ""
  - key: CHAT_DEFAULT_LIGHT
    label: "Ampel eines neuen Gespraechs: green (sensible Daten, Vorgabe) oder yellow (z. B. Demo, Schulung); red ist nie die Vorgabe"
    default: "green"
  - key: CHAT_ASSISTANTS_ONLY
    label: "Optional: nur diese Assistenten (Kennungen, durch Komma getrennt) in diesem Chat anbieten -- z. B. ein Schulungs-Chat (RFC-0097 D9)"
    default: ""
  - key: CHAT_AI_GATEWAY
    label: "Optional: Name des KI-Gateways, wenn der Mandant mehrere hat (RFC-0104) -- gilt nur ohne Destination ki"
    default: ""
  - key: CHAT_MODEL_EXTRA
    label: "Weitere Felder fuer jeden Modellzug als JSON, z. B. {\"reasoning\": {\"effort\": \"none\"}} fuer qwen3:8b"
    default: ""

health:
  path: /healthz
