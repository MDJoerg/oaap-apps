oaap_manifest: "0.13"

app:
  id: chat
  name: Chat
  version: 0.4.1
  type: native
  class: frontend
  description: "Der Plattform-Chat, erste Fassung (RFC-0074 Stufe 2): ein Assistent (oaap.ai.assistants 0.1) mit den Werkzeugen einer Sicht des MCP-Gateways und einem Modell des KI-Gateways. Jeder Werkzeugaufruf laeuft als die Person, die schreibt (Verfahren A); was etwas aendert, erst nach ihrer Zustimmung. Verlauf je Person unter /data. Seit 0.4.1 eigene Frage sofort sichtbar, Denkanzeige, /-Suchliste mit Befehlen des Chats, Einrichtung pruefen als Dialog, Kopf- und Eingabezeile fest. Seit 0.4.0 Ansichten von MCP Apps (Sandbox-Proxy auf zweiter Herkunft, Plattform ab 0.1.245). Seit 0.3.0 Markdown und Mermaid in Antworten, Gespraeche umbenennen/loeschen, Einrichtung pruefen. Seit 0.2.0 mehrere Assistenten (privat, Team, Mandant), /Befehle aus den Prompts der Sicht, Zustimmung ans Gateway gemeldet. Plattform ab 0.1.243"

care:
  # RFC-0071 §15: nur Standardbibliothek, beim Bau wird nichts nachgeladen.
  rebuild: self

services:
  web:
    build: .
    port: 8000

routes:
  - path: /
    roles: [admin, keyuser, user]

storage:
  - name: data
    mount: /data

# RFC-0074 D5: der Chat handelt an den MCP-Gateways seines Mandanten als die
# Person, die mit ihm spricht. Der Schluessel dafuer oeffnet allein nichts --
# er braucht die Zusicherung der Person aus derselben Anfrage.
mcp_client:
  use: true

# Manifest 0.13 (RFC-0075 D6): die Seite des Sandbox-Proxys fuer Ansichten von MCP
# Apps. Die Plattform gibt ihr eine zweite Herkunft (<instanz>--ui...) ohne
# Anmeldung und ohne Kekse; einbetten darf sie nur der Chat selbst.
ui_sandbox:
  path: /ui-sandbox

# Das Modell: eine Destination auf ein KI-Gateway (der Schluessel bleibt auf
# der Plattform). Im geschlossenen Mandanten nur ein Schluessel mit Ampel gruen.
# RFC-0074 D4 ueber RFC-0045: wer einen Team-Assistenten sieht (use) und pflegt
# (manage). Der Mandant vergibt die Vorlagen in "Rollen & Rechte" mit dem Team
# als Kontext. Private Assistenten legt jede Person fuer sich an, solche fuer den
# ganzen Mandanten nur tenant_admin.
authorization:
  objects:
    - key: assistant
      title: Assistent
      activities: [use, manage]
      fields:
        - key: team
          context: Team
  role_templates:
    - key: assistant_user
      title: Assistenten des Teams benutzen
      grants:
        - object: assistant
          activities: [use]
          team: $context
    - key: assistant_keyuser
      title: Assistenten des Teams pflegen
      grants:
        - object: assistant
          activities: [use, manage]
          team: $context

destinations:
  - name: ki
    kind: http
    purpose: "KI-Gateway (OpenAI-Schnittstelle bis /v1) fuer die Modellzuege des Assistenten"

config:
  - key: CHAT_ASSISTANT
    label: "Optional: ein Assistent fuer den ganzen Mandanten als JSON (oaap.ai.assistants 0.1), gepflegt nur hier; weitere legen die Leute im Chat an"
    default: ""
  - key: CHAT_MODEL_EXTRA
    label: "Weitere Felder fuer jeden Modellzug als JSON, z. B. {\"reasoning\": {\"effort\": \"none\"}} fuer qwen3:8b"
    default: ""

health:
  path: /healthz
