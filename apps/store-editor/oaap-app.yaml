oaap_manifest: "0.2"

app:
  id: store-editor
  name: OAAP Store Editor
  version: 0.3.0
  type: native
  # Der Editor hat eine Oberfläche — das ist der Normalfall und stünde
  # auch ohne diese Zeile so da. Sie steht trotzdem hier, weil eine App,
  # die Listen auf genau dieses Feld prüft, es selbst führen sollte
  # (Runtime-Spec 2.10, RFC-0012 §1.2).
  class: frontend
  description: "Store-Listen prüfen: gegen das Format und gegen die Manifeste, auf die sie zeigen"

services:
  web:
    build: .
    port: 8000

routes:
  # Listen zu pflegen ist redaktionelle Arbeit (RFC-0013 Entscheidung 2):
  # `user` schlägt vor, `keyuser` gibt frei. Bauschritt 2 schreibt nur
  # in die Arbeitskopie dieser Instanz und veröffentlicht nichts — also
  # darf jeder von ihnen daran arbeiten; die Trennung bekommt ihre
  # Wirkung in Bauschritt 3, wo ein Vorschlag und eine Freigabe zwei
  # verschiedene Dinge werden. Ausdrücklich NICHT server_admin — das
  # wäre Serververwaltung, und der Administrator ist weder der richtige
  # Richter über einen Beschreibungstext noch der Flaschenhals, durch
  # den jede Textänderung soll.
  - path: /
    roles: [user, keyuser, admin]

storage:
  # Die Arbeitskopien der Listen: bearbeiteter Stand, veröffentlichter
  # Stand als Vergleich, und die Markierungen der Übersteuerungen
  # (RFC-0012 §1.3). Sie überleben damit Neustart, Redeploy und Update
  # wie die Daten jeder anderen App und sind in `oaap backup create`
  # enthalten. In die Liste selbst gehört diese Buchführung nicht: Eine
  # Liste ist ein Dokument nach `oaap-store.schema.json`.
  - name: entwuerfe
    mount: /data

config:
  # Mehrere Listen je Instanz ist RFC-0013 Entscheidung 3. Diese Angabe
  # ist nur noch das Saatgut: Beim ersten Start wandern die Adressen in
  # die Quellenverwaltung des Editors, wo ein `keyuser` sie pflegt.
  - key: STORE_EDITOR_LISTS
    label: "Listen zum Start (Adressen, durch Komma getrennt)"
    default: "https://raw.githubusercontent.com/MDJoerg/oaap-store/main/oaap-store.json,https://raw.githubusercontent.com/MDJoerg/oaap-apps/main/oaap-store.json"

  # Zugangsschlüssel für private Listen — RFC-0013, Entscheidung Jörgs
  # vom 09.08.2026 (Form A). Sie stehen hier und nicht in der Ablage des
  # Editors: `secret: true` heißt eintragbar, nie zurücklesbar, und die
  # Plattform hält Geheimnisse ohnehin schon. Eine App, die sich dafür
  # etwas Eigenes ausdenkt, baut denselben Mechanismus schwächer nach.
  #
  # Drei feste Plätze sind eine echte Obergrenze, und sie ist ABSICHT:
  # sichtbar statt versteckt. Braucht es einen vierten, ist genau das
  # der Beleg dafür, dass die Plattform zur Laufzeit hinzufügbare
  # Geheimnisse bekommen sollte — statt sie vorher zu erraten.
  #
  # Heute nur LESEN. Ein Schreibtoken kommt als eigenes Feld mit
  # Bauschritt 3: Ein Lesetoken ist kein Schreibrecht, und beides in
  # einem Feld gewährt mehr als nötig.
  - key: STORE_EDITOR_TOKEN_1
    label: "Lesetoken, Platz 1 (nur bei einem privaten Repository nötig)"
    secret: true
  - key: STORE_EDITOR_TOKEN_2
    label: "Lesetoken, Platz 2"
    secret: true
  - key: STORE_EDITOR_TOKEN_3
    label: "Lesetoken, Platz 3"
    secret: true

health:
  path: /healthz
  startup_grace_seconds: 30
