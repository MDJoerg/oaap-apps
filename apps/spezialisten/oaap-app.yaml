oaap_manifest: "0.20"

app:
  id: spezialisten
  name: Spezialisten
  version: 0.6.2
  type: native
  class: frontend
  description: "KI-Spezialisten, die Vorgänge im Hintergrund bearbeiten. Ein Spezialist ist eine festgehaltene Assistenten-Revision (Kennung@Revision) mit eigenem Agenten und engen Rechten nur in seinen Bereichen. Die App fragt alle 30 s die App Vorgänge (ab 0.13.0), welche Vorgänge an ihm dran sind, liest den Vorgang als zitierte Daten, ruft nur Werkzeuge seiner eigenen Sicht im MCP-Gateway und das Modell über das KI-Gateway, schreibt jeden Schritt intern in den Vorgang und gibt am Ende an die Zuständigen zurück. Ändernde Werkzeuge nur nach Freigabe eines Menschen (unterschrieben, Vorgänge ab 0.16.0); Antworten an die Meldende nur als Entwurf; Rückfragen an andere Spezialisten oder Menschen des Bereichs. Grenzen je Lauf und je Vorgang, Stopp-Knopf am Vorgang. Gepflegt vom Mandanten-Administrator; die drei Schlüssel werden nie zurückgezeigt. Lesende MCP-Tür: Spezialisten und ihre Läufe."

care:
  rebuild: self

services:
  web:
    build: .
    port: 8000

routes:
  # Seiten und MCP-Tür (/mcp) für dieselben Rollen; pflegen dürfen nur admin/tenant_admin.
  - path: /
    roles: [admin, keyuser]

# RFC-0118 §9: lesende MCP-Tür -- Spezialisten und ihre Läufe, nie ein Schlüssel.
mcp:
  path: /mcp
# RFC-0119 (Manifest 0.20): Vorlagen für Assistenten, die die App mitbringt. Der Knoten
# kopiert sie je Mandant wie die Doku; im Portal unter „Assistenten“ als Karte „von der App“.
assistant_templates:
  path: assistants/

storage:
  - name: data
    mount: /data

config:
  - key: SPEZ_POLL_SECONDS
    label: "Wie oft die App bei Vorgänge fragt, was an den Spezialisten dran ist (Sekunden, 10-3600)"
    default: "30"
  - key: SPEZ_MAX_STEPS
    label: "Grenze des Mandanten: Modell- und Werkzeugschritte je Lauf (je Spezialist nur niedriger)"
    default: "20"
  - key: SPEZ_MAX_MINUTES
    label: "Grenze des Mandanten: Minuten je Lauf"
    default: "10"
  - key: SPEZ_MAX_RUNS
    label: "Grenze des Mandanten: Läufe je Vorgang; danach geht er an die Zuständigen zurück"
    default: "10"

# RFC-0094 / RFC-0118: die Hilfe der App -- an die Hilfe des Mandanten und an den Chat.
docs:
  - product: spezialisten
    title: "Spezialisten"
    path: docs/
    entry: index.md
    lang: de
    audience: [admin, keyuser]
    readers: [power-user, admin]
    kinds:
      index.md: overview
      spezialist-einrichten.md: howto
      laeufe-verfolgen.md: howto
      freigaben-und-rueckfragen.md: concept
      faq.md: faq

health:
  path: /healthz
