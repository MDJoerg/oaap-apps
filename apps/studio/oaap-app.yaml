oaap_manifest: "0.20"

app:
  id: studio
  name: Studio
  version: 0.8.2
  type: native
  # Das Studio hat eine Oberfläche — das ist der Normalfall und stünde
  # auch ohne diese Zeile so da (Runtime-Spec 2.10, RFC-0012 §1.2).
  class: frontend
  description: "Entwicklungsvorhaben verwalten, KI-Briefings erzeugen, Pakete prüfen und ausrollen"

care:
  # RFC-0071 §15 (Manifest 0.10): PyYAML fest auf 6.0.3, Debians Korrekturen per
  # apt-get upgrade (§16) -- ein Neubau ändert nur die Basis.
  rebuild: self

services:
  web:
    build: .
    port: 8000

routes:
  # Studio ist Sache der Projektverantwortlichen (Design-Guidelines 5:
  # „Studio — keyuser+"). Das Gateway erzwingt es, die App prüft zusätzlich.
  #
  # Ausdrücklich NICHT server_admin, obwohl hier Pakete ausgerollt werden:
  # Das Recht dazu ist der Deploy-Token, den der Anwender im Augenblick
  # der Handlung eingibt (RFC-0019, Abschnitt „Studio"). Eine Rolle, die
  # das Studio zur Serververwaltung machte, würde genau die Trennung
  # aufheben, um die es dort geht.
  - path: /
    roles: [keyuser, admin]

# Die MCP-Tür (RFC-0118 §9): Assistenten des Mandanten lesen Vorhaben und
# Briefings -- mit denselben Rollen wie die Seite (Route / oben: keyuser,
# admin). Nur lesend; der Deploy-Token bleibt beim Menschen.
mcp:
  path: /mcp
# RFC-0119 (Manifest 0.20): Vorlagen für Assistenten, die die App mitbringt. Der Knoten
# kopiert sie je Mandant wie die Doku; im Portal unter „Assistenten“ als Karte „von der App“.
assistant_templates:
  path: assistants/

storage:
  - name: data
    mount: /data

config:
  # Verweis auf den verbindlichen App Deployment Contract; steht in jedem
  # erzeugten Briefing. Eigene Kopie/Fork? Hier die eigene Adresse eintragen.
  - key: STUDIO_CONTRACT_URL
    label: "Adresse des App Deployment Contract"
    default: "https://github.com/MDJoerg/oaap-spec/blob/main/docs/app-deployment-contract.md"
  # Basis-Adresse des eigenen Git-Hostings (z. B. die Forgejo-App), damit
  # Repo-Vorschläge dazu passen. Leer = keine Vorschläge.
  - key: STUDIO_GIT_BASE
    label: "Basis-Adresse des Git-Hostings"
    default: ""
  # Obergrenze für ein hochgeladenes Paket. Der Knoten nimmt bis 256 MB
  # an; das Studio bleibt bewusst darunter, weil es die Datei
  # zwischenlagert. Höher setzen, wenn die Pakete wirklich größer sind.
  - key: STUDIO_MAX_PACKAGE_MB
    label: "Größtes Paket (MB)"
    default: "64"
  # Wie lange auf den Knoten gewartet wird. Ein Bau auf dem Gerät dauert;
  # antwortet der Hook mit 202, ist das kein Fehler, sondern „läuft noch".
  - key: STUDIO_DEPLOY_TIMEOUT_SECONDS
    label: "Geduld beim Deployment (Sekunden)"
    default: "180"
  # Adresse des Portals — nur für Verweise („Instanz im Portal öffnen").
  # Leer = das Studio leitet sie aus dem eigenen Hostnamen ab. Gilt für
  # den EIGENEN Knoten; der Zielknoten eines Vorhabens ergibt sich aus
  # dessen Deploy-Hook (seit 0.3).
  - key: STUDIO_PORTAL_URL
    label: "Adresse des Portals (für Verweise)"
    default: ""
  # Je Zielknoten ein Flotten-Schlüssel (auf dem betreffenden Knoten
  # ausgestellt mit 'sudo oaap fleet key issue <label>'):
  # knoten=schlüssel, ';' oder Zeilenumbruch trennt. Damit zeigt die
  # Seite eines Vorhabens den Zustand seiner Test- und Produktiv-Instanz.
  #
  # Das ist kein Bruch der Regel „Das Studio hält nie ein Recht": Ein
  # Flotten-Schlüssel kann ausschließlich GET /fleet/status lesen —
  # keine Sitzung, keine Rollen, kein Schreibweg (Spec
  # oaap.fleet.status §2) —, und dieses Dokument enthält Fakten, nie
  # Geheimnisse (§3.1). Das Recht zu HANDELN bleibt unverändert beim
  # Anwender: der Deploy-Token wird bei jedem Upload eingegeben.
  # Leer lassen ist eine gültige Betriebsart — dann fehlt genau diese
  # Anzeige und sonst nichts.
  - key: STUDIO_FLEET_KEYS
    label: "Flotten-Schlüssel je Zielknoten (knoten=schlüssel, ';' trennt)"
    multiline: true
    secret: true

docs:
  # RFC-0094 (Manifest 0.17): die Anwenderhilfe des Studios geht an die
  # Hilfe des Mandanten und damit auch an den Chat (help_search). Sichtbar
  # für dieselben Rollen, die das Studio betreten dürfen.
  - product: studio
    title: "Studio"
    path: docs/
    entry: index.md
    color: "#2563eb"
    lang: de
    audience: [keyuser, admin]
    readers: [power-user, admin]
    kinds:
      index.md: overview
      vorhaben-und-briefing.md: howto
      onboarding.md: howto
      paket-ausrollen.md: howto
      zielknoten-und-zustand.md: concept
      deploy-token.md: concept
      faq.md: faq

health:
  path: /healthz
  startup_grace_seconds: 30
