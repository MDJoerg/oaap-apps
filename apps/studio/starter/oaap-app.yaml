oaap_manifest: "0.18"

# ---------------------------------------------------------------------
# Starter-Paket: das kleinste Manifest, das durch die Prüfung geht —
# und darunter, auskommentiert, alles, was eine App heute zusätzlich
# von der Plattform bekommen KANN.
#
# Zum Anpassen: app.id, app.name, app.version und app.description
# ändern (und docs.product/title unten mit) — der Rest des aktiven Teils passt für die allermeisten Apps
# unverändert. Die auskommentierten Abschnitte nimmst Du nur, wenn Du
# sie brauchst. Jeder ist optional, und keiner gewährt etwas von
# selbst: Die App ERKLÄRT, ein Mensch im Mandanten GEWÄHRT.
#
# Maßgeblich ist der App Deployment Contract (steht im Briefing) und
# das JSON-Schema oaap-app.schema.json aus oaap-spec.
# ---------------------------------------------------------------------

app:
  # Kleinbuchstaben, Ziffern, Bindestriche, 3–40 Zeichen. Die Kennung
  # ist unveränderlich: Ein Deployment mit anderer Kennung wird hart
  # abgelehnt, weil es eine andere App wäre. Der Name der INSTANZ ist
  # davon unabhängig — den wählt, wer sie anlegt, und er ist änderbar.
  id: starter
  # Der Name sagt, was die App tut -- deutsch, kurz, OHNE „OAAP“ (RFC-0118
  # §3: OAAP ist der Rahmen, nicht Teil jedes Bildes). Derselbe Name steht
  # auf der Seite, in der Kachel und in docs.title.
  name: Starter
  # Muss bei JEDEM Deployment steigen (1.2.3). Unveränderte Version =
  # harte Ablehnung. Einzige Ausnahme: das erneute Anmelden desselben
  # Pakets, nachdem ein Mensch den erweiterten Rahmen bestätigt hat.
  version: 0.3.0
  # native = Quellcode, die Plattform baut das Image auf dem Zielknoten
  # (also auf amd64 UND arm64 — keine architekturgebundenen Basisimages).
  type: native
  # frontend = hat eine Oberfläche; service = nur Hintergrunddienst.
  class: frontend
  description: "Kleinste lauffähige OAAP-App — Vorlage für eigene Pakete"

services:
  web:
    # Baut aus dem Dockerfile neben dieser Datei.
    build: .
    # Genau EIN HTTP-Port, kein TLS in der App — das macht das Gateway.
    port: 8000

routes:
  # Wer die App überhaupt erreicht, entscheidet das Gateway anhand
  # dieser Liste. `public` hieße: ohne Anmeldung — dann steht die Route
  # im Internet offen, und der Knoten verlangt dafür eine Bestätigung.
  - path: /
    roles: [user, keyuser, admin]

storage:
  # Alles, was einen Neustart überleben soll, gehört in einen
  # deklarierten Mount. Nur diese Pfade werden gesichert; alles andere
  # im Container ist nach dem nächsten Deployment weg.
  - name: data
    mount: /data

config:
  # Konfiguration kommt ausschließlich über deklarierte
  # Umgebungsvariablen. Geheimnisse bekommen `secret: true` — dann
  # zeigt das Portal den Wert nie wieder zurück. Ein Wert, den DIESE App
  # selbst festlegt (eigener Schlüssel), darf `generate: token` tragen:
  # Dann bietet das Portal an, ihn zu erzeugen. Nie für fremde Zugangs-
  # daten. Nicht deklarierte Schlüssel lassen sich weder im Portal noch
  # per Kommandozeile setzen — mit Absicht.
  - key: STARTER_GREETING
    label: "Begrüßung auf der Startseite"
    default: "Willkommen"

health:
  # Der Knoten fragt hier, ob die App lebt. Ohne Anmeldung, ohne
  # Seiteneffekte, schnell.
  path: /healthz
  startup_grace_seconds: 20

care:
  # Dein Versprechen: Derselbe Quellcode auf einer frisch gezogenen
  # Basis gebaut ändert nichts außer der Basis (Abhängigkeiten fest
  # gepinnt, Dockerfile spielt Debians Korrekturen ein). Dann darf der
  # Knoten bei Sicherheitsmeldungen selbst neu bauen. Kannst Du das
  # nicht versprechen, schreib `release` — dann heilt erst Deine
  # nächste Version.
  rebuild: self

launchpad:
  # Überschrift, unter der die Kachel im Portal erscheint. Nur Anzeige —
  # wer die Kachel sieht, entscheiden die Rollen oben.
  group: Werkzeuge

docs:
  # Hilfe ist Pflicht für jede App mit Oberfläche (RFC-0118 §9): Der Knoten
  # gibt diese Markdown-Dateien an die Hilfe des Mandanten weiter; „Hilfe“
  # in der Kopfleiste öffnet sie, und der Chat antwortet daraus. Mindestens
  # eine Übersicht, eine Anleitung je Hauptaufgabe und häufige Fragen --
  # in der Sprache der Anwender, ohne Entwicklerwörter.
  - product: starter
    title: "Starter"
    path: docs/
    entry: index.md
    lang: de
    audience: [user, keyuser, admin]
    readers: [user]
    kinds:
      index.md: overview

# =====================================================================
# OPTIONAL — Fähigkeiten der Plattform. Einkommentieren, was Du nutzt.
# Jeder Abschnitt nennt, welche Variable die App dafür bekommt. Diese
# OAAP_*-Variablen gehören der Plattform: Du deklarierst sie NICHT
# unter `config`, und niemand kann sie überschreiben.
# =====================================================================

# --- Digitaler Zwilling: gemeinsame Daten des Mandanten -------------
# Mehrere Apps beschreiben dieselben Objekte, jede in ihrer eigenen
# Gruppe; Relationen verbinden die Objekte. Wer ein Objekt anlegt, ist
# `owner` und besitzt dessen Kerngruppe; andere Apps schreiben als
# `contributor` in ihre eigene Gruppe daran, `consumes` liest.
# Die App bekommt OAAP_TWIN_URL (endet schon auf /twin — hänge nur
# /objects usw. an) und OAAP_PLATFORM_KEY (als Bearer senden).
# Voraussetzung: Der Knoten trägt das Profil `store`. Ohne läuft die
# App ganz normal, nur ohne diese beiden Variablen — prüfe das, statt
# abzustürzen.
# WICHTIG: Der Zwilling ist heute append-only und kennt kein Löschen.
# Keine personenbezogenen Daten im Klartext hinein — nur Schlüssel,
# Titel, Relationen, Zustände (auch der Gesundheitszustand der App)
# und andere Fakten ohne Personenbezug. Die
# eigentlichen Daten bleiben in Deiner App.
#
# data_model:
#   object_types:
#     - key: Auftrag
#       title: Auftrag
#       title_plural: Aufträge
#       identifying: []
#   attribute_types:
#     - key: Status
#       title: Status
#       value_type: text
#   group_types:
#     - key: starter.core
#       "on": Auftrag
#       attributes: [Status]
#       relations: [forCustomer]
#       activities: []
#     - key: starter.notes        # eigene Gruppe an einem fremden Typ
#       "on": Firma
#       attributes: [Status]
#   relation_types:
#     - key: forCustomer
#       title: "is order for"
#       title_inverse: "has order"
#       from: Auftrag
#       to: Firma
#
# contributes:
#   - type: Auftrag
#     role: owner
#   - type: Firma               # Objekt einer anderen App ergänzen
#     role: contributor
#     group: starter.notes
#
# consumes:
#   - type: Firma
#     as: Kunde
#     fields: [reference]

# --- Fachliche Berechtigungen (RFC-0045) -----------------------------
# Feiner als die Plattformrollen: Die App erklärt Objekte und Tätig-
# keiten, der Mandant vergibt sie (Portal „Rollen & Rechte“), die App
# fragt nach: GET {OAAP_AUTHZ_URL}/effective?user=<X-OAAP-User-Id>
# mit Bearer OAAP_AUTHZ_KEY. Antwort höchstens 30 s zwischenspeichern;
# bei Fehler ablehnen (fail closed).
#
# authorization:
#   objects:
#     - key: order
#       title: Auftrag
#       activities: [read, edit, close]
#   role_templates:
#     - key: order_clerk
#       title: Sachbearbeitung
#       grants:
#         - object: order
#           activities: [read, edit]

# --- Destinationen: benannte Ziele draußen (RFC-0033) -----------------
# Statt Adresse und Zugangsdaten selbst zu konfigurieren: Der Betreiber
# bindet eine Destination des Mandanten an die Instanz, die App bekommt
# OAAP_DESTINATION_<NAME>_URL. Ist der Mandant „geschlossen“
# (RFC-0068), ist das der EINZIGE Weg nach draußen.
#
# destinations:
#   - name: crm
#     kind: http
#     purpose: "Abgleich der Kundenstammdaten"

# --- Vorgänge aus dem Backend öffnen (RFC-0061) ----------------------
# Die App bekommt OAAP_CASES_URL und OAAP_CASES_KEY und kann im
# Vorgänge-Postkorb ihres Mandanten Fälle anlegen (Fehler, Freigaben,
# Rückfragen an Menschen).
#
# cases:
#   submit: true

# --- MCP: die App als Werkzeugquelle für KI (RFC-0073) ----------------
# Hält Deine App Daten (Aufträge, Geräte, Einträge …), gehört eine MCP-Tür
# dazu (RFC-0118 §9): Lesewerkzeuge `<app>_list`, `<app>_search`,
# `<app>_read`, Schreibwerkzeuge nur, wo die Seite dieselbe Handlung
# anbietet. Die App bedient MCP (Streamable HTTP) unter diesem Pfad, der
# unter einer ihrer Routen liegen muss. Das MCP-Gateway des Mandanten bietet
# die Werkzeuge KI-Assistenten an — im Namen der Person, die fragt: Die
# App sieht dieselben X-OAAP-*-Kopfzeilen und prüft dieselben Rechte
# wie auf ihren Seiten.
#
# mcp:
#   path: /mcp

# --- Assets melden (RFC-0087 §8.2) -----------------------------------
# Unter diesem Pfad fragt der Knoten, woraus die App besteht (heute nur
# die Arten `model` und `source`, gedacht für Gateways). Nur Namen und
# ok/down/idle — nie Adressen, Schlüssel oder Personen.
#
# assets:
#   path: /oaap/assets
