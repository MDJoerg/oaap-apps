oaap_manifest: "0.2"

app:
  id: code-server
  name: Code-Server (VS Code im Browser)
  version: 0.1.1
  type: wrapped
  class: frontend
  description: "VS Code im Browser, ein Container je Mensch: Arbeitsplatz für Schulungen und für Teilnehmer, deren Laptop nichts installieren darf. Anmeldung übernimmt das Gateway (code-server läuft ohne eigenes Passwort), Terminal und Erweiterungen liegen in der Ablage der Instanz. Vorinstalliert: Claude Code, ABAP Remote Filesystem, SAP CDS Language Support — weitere Erweiterungen aus Open VSX per Konfiguration."

# Ein Container, gebaut über dem offiziellen Abbild (Vorbild
# `apps/keycloak`): wir bauen code-server nicht selbst, wir legen nur
# Werkzeuge, vorinstallierte Erweiterungen und einen Entrypoint darüber.
# Die Version ist im Dockerfile festgenagelt; code-server nennt seine
# Fassung unter /healthz nicht, wohl aber `code-server --version` im
# Terminal — das macht die Zahl prüfbar.
services:
  ide:
    build: .
    port: 8080

# Eine Route, angemeldet. code-server selbst läuft mit `--auth none`:
# die Tür ist das Gateway (Forward-Auth, auch für den WebSocket, den
# jedes Terminal braucht — RFC-0010). Wer die Instanz sehen darf,
# entscheidet der Betreiber je Instanz über Sichtbarkeitsgruppen
# (Runtime 2.7): in einer Schulung trägt jeder Teilnehmer seine eigene
# Gruppe, und seine Instanz ist auf genau diese beschränkt.
routes:
  - path: /
    roles: [user, keyuser, admin]

storage:
  # Das ganze Zuhause: Projekte, Einstellungen, installierte
  # Erweiterungen, Shell-Historie. Ein Neuaufsetzen der Instanz mit
  # `--purge` löscht genau das.
  - name: home
    mount: /home/coder
  # Das Kursmaterial, getrennt vom Zuhause: ein Verzeichnis, das ein
  # Werkzeug (die künftige „Kohorte") füllen oder austauschen kann, ohne
  # die Arbeit des Teilnehmers anzufassen. Liegt im Container unter
  # ~/material.
  - name: material
    mount: /home/coder/material

config:
  # Weitere Erweiterungen, eine je Zeile: eine Open-VSX-Kennung
  # (code-server bezieht von dort, nicht vom Microsoft-Marktplatz), z. B.
  # SAPSE.sap-ux-fiori-tools-extension-pack — oder die https-Adresse
  # einer .vsix-Datei, die der Hersteller selbst verteilt (0.1.1; ABAP
  # cleaner liegt als GitHub-Release vor, nicht auf Open VSX). Werden
  # beim Start nachinstalliert, falls sie fehlen — best effort, ein
  # Fehlschlag verhindert den Start nicht.
  - key: IDE_EXTENSIONS
    label: "Zusätzliche Erweiterungen (Open-VSX-Kennung oder https-Adresse einer .vsix, eine je Zeile)"
    multiline: true
    default: ""
  # `sudo` im Container: das offizielle Abbild erlaubt es dem Benutzer
  # `coder` ohne Passwort, und für eine Schulung ist genau das der
  # Punkt (apt install, npm -g). Wer das nicht will, schaltet es hier
  # ab; die Regel wird beim Start entfernt. Der Container ist ohnehin
  # kein Weg auf den Knoten (eigenes Instanznetz, kein Docker-Socket).
  - key: IDE_SUDO
    label: "sudo im Container erlauben (ja/nein)"
    default: "ja"
  # Für das Claude-Code-Plugin: ein API-Schlüssel, den die Schule
  # stellt. Erreicht Terminal und Plugin als Umgebungsvariable; bleibt
  # leer, wenn Teilnehmer sich selbst anmelden sollen. Nicht `generate`:
  # das ist Anthropics Geheimnis, nicht unseres.
  - key: ANTHROPIC_API_KEY
    label: "Anthropic-API-Schlüssel für Claude Code (optional; leer = eigene Anmeldung)"
    secret: true
  # Für später: Claude Code über ein eigenes Gateway beziehen (RFC-0023),
  # sobald das Gateway das Anthropic-Protokoll spricht.
  - key: ANTHROPIC_BASE_URL
    label: "Anthropic-kompatible Basisadresse (optional, z. B. ein KI-Gateway)"
    default: ""
  - key: TZ
    label: "Zeitzone im Container"
    default: "Europe/Berlin"

health:
  # code-servers eigene Lebensprüfung, antwortet ohne Anmeldung mit
  # {"status":"alive"} — genau das, was das Gateway sehen muss.
  # Der erste Start kopiert die vorinstallierten Erweiterungen ins
  # Zuhause; danach ist er schnell.
  path: /healthz
  startup_grace_seconds: 90
