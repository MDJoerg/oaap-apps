oaap_manifest: "0.20"

app:
  id: projekt
  name: Projekte
  version: 0.3.2
  type: native
  class: frontend
  description: "Projekte mit Kunde, Status und Beginn pflegen -- alle Projekte des Mandanten im digitalen Zwilling, auch die aus der Partnerverwaltung"

care:
  # RFC-0071 §15 (Manifest 0.10): Nur Standardbibliothek, beim Bau wird nichts nachgeladen — ein Neubau ändert nur die Basis.
  rebuild: self

services:
  web:
    build: .
    port: 8000

routes:
  # deckt auch /mcp ab: das MCP-Gateway reicht die Person durch, die Tür
  # prüft wie die Seiten (RFC-0073, RFC-0118 §9)
  - path: /
    roles: [user]

mcp:
  path: /mcp
# RFC-0119 (Manifest 0.20): Vorlagen für Assistenten, die die App mitbringt. Der Knoten
# kopiert sie je Mandant wie die Doku; im Portal unter „Assistenten“ als Karte „von der App“.
assistant_templates:
  path: assistants/

storage:
  - name: data
    mount: /data

# RFC-0031 Zielbild (program/zielbild-datenplattform.md, Runde 1,
# Punkt 5): "Projekte als Beispiel fuer 'gleiches Datenobjekt,
# verschiedene Herkunft' -- erzeugt von einer eigenen Projekt-App
# und/oder in der Kunden-/Partnerverwaltung ... ein Typ, viele Owner,
# jede Instanz mit ihrer Herkunft."
#
# WIE das tatsaechlich geht, ohne RFC-0031 D1 zu verletzen ("nur die
# Herkunft aendert ihre Typen"): diese App ist die einzige, die
# 'Projekt' unter data_model.object_types DEFINIERT (Herkunft
# 'app:projekt'). Partnerverwaltung bekommt KEINE zweite Definition --
# sie deklariert in ihrem eigenen Manifest nur
# 'contributes: [{type: Projekt, role: owner}]' und bindet sich damit
# an DIESEN, schon registrierten Typ (oaap.data.model 0.1 SS2.4:
# Bindung ist unabhaengig von Definition). Geprueft am echten Code
# (platform/services/twin/app.py's create_object): die Owner-Pruefung
# fragt nur "steht {type: Projekt, role: owner} in DIESER Instanz
# eigenen Bindungen", nie "hat diese Instanz den Typ definiert" -- ZWEI
# Apps koennen also unabhaengig voneinander Projekt-Objekte anlegen,
# jedes mit seiner eigenen Herkunft am Objekt (RFC-0031 SS3.3), ohne
# dass eine App die andere kennt. Das ist der "geteilte digitale
# Zwilling" aus dem Zielbild, nicht ein Sonderfall.
data_model:
  object_types:
    - key: Projekt
      title: Projekt
      title_plural: Projekte
      identifying: []
  attribute_types:
    - key: Status
      title: Status
      value_type: text
    - key: StartDate
      title: Beginn
      value_type: date
  group_types:
    - key: project.core
      "on": Projekt
      attributes: [Status, StartDate]
      relations: [forCustomer]
      activities: []
  relation_types:
    - key: forCustomer
      # title ist reine Anzeige (additiv); title_inverse bleibt wie registriert
      title: "ist Projekt für"
      title_inverse: "has project"
      from: Projekt
      to: Firma

contributes:
  - type: Projekt
    role: owner

consumes:
  - type: Firma
    as: Kunde
    fields: [reference]

docs:
  # RFC-0094 / RFC-0118 §9: die Anwenderhilfe geht an die Hilfe des Mandanten
  # und damit auch an den Chat.
  - product: projekt
    title: "Projekte"
    path: docs/
    entry: index.md
    lang: de
    audience: [user]
    readers: [end-user]
    kinds:
      index.md: overview
      projekt-anlegen.md: howto
      projekte-finden.md: howto
      faq.md: faq

health:
  path: /healthz
  startup_grace_seconds: 10
