oaap_manifest: "0.3"

app:
  id: partnerverwaltung
  name: OAAP Partnerverwaltung
  version: 0.1.0
  type: native
  class: frontend
  description: "Referenz-App fuer den digitalen Zwilling (RFC-0031 Schritt 4): Owner von Firma und Kontaktperson, verknuepft sie mit isContactOf"

services:
  web:
    build: .
    port: 8000

routes:
  - path: /
    roles: [user]

storage:
  # Nur der eigene Index (id + type dieser Instanz eigener Objekte) --
  # keine Titel, keine Attribute. Der Zwilling ist die einzige Quelle
  # dafuer; siehe app.py's Modulkommentar.
  - name: data
    mount: /data

# RFC-0031 SS5 / oaap.data.model 0.1 SS2.2 -- die Typen dieser App und
# was sie davon besitzt. Fast wortgleich mit dem CRM-Beispiel dort und
# in test_data_model.py's eigener Fixtur -- bis auf die OBJECT-TYPE-
# SCHLUESSEL selbst: 'Customer'/'Person' sind auf oaap-test bereits
# PERMANENT von 'app:model-live-check' belegt, einem Wegwerf-Probe-Paket
# aus Schritt 2s eigener Live-Pruefung (CURRENT_STATE, 09.09.). oaap.
# data.model 0.1 hat bewusst KEIN 'unregister' (SS2.1: "0.1 has no CLI to
# drop a type at all"), also bleibt die Belegung stehen, auch nachdem
# die Probe-Instanz laengst entfernt wurde -- gefunden beim Installieren
# DIESER App auf oaap-test (RFC-0031 Schritt 4, 2026-09-10). 'Firma'/
# 'Kontaktperson' sind die eigenen, dauerhaften Schluessel dieser
# Referenz-App; alles andere (Attribut-, Gruppen-, Relations- und
# Aktivitaetstypen) kollidiert mit nichts Registriertem.
data_model:
  object_types:
    - key: Firma
      title: Firma
      title_plural: Firmen
      identifying: [VatId, Email]
    - key: Kontaktperson
      title: Kontaktperson
      title_plural: Kontaktpersonen
      identifying: [Email]
  attribute_types:
    - key: VatId
      title: USt-ID
      value_type: text
    - key: Email
      title: E-Mail
      value_type: text
    - key: Location
      title: Standort
      value_type: text
    - key: Phone
      title: Telefon
      value_type: text
  group_types:
    - key: crm.core
      "on": Firma
      attributes: [VatId, Email, Location, Phone]
      relations: []
      activities: [PhoneCall, Task]
    - key: crm.contact
      "on": Kontaktperson
      attributes: [Email, Phone]
      relations: [isContactOf]
      activities: [PhoneCall, Task]
  relation_types:
    - key: isContactOf
      title: "is contact of"
      title_inverse: "has contact"
      from: Kontaktperson
      to: Firma
      valid: true
  activity_types:
    - key: PhoneCall
      title: Phone call
      is_task: false
    - key: Task
      title: Task
      is_task: true

contributes:
  - type: Firma
    role: owner
  - type: Kontaktperson
    role: owner

health:
  path: /healthz
  startup_grace_seconds: 10
