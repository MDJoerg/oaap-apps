oaap_manifest: "0.18"

app:
  id: rollen-rechte
  name: Rollen & Rechte
  version: 0.3.0
  type: native
  class: frontend
  description: "Werkzeug des Mandanten-Admins für fachliche Berechtigungen: wer darf was in welcher App – Personen, Rollen, Berechtigungspakete, Zuordnungen, Gruppen des Anmeldedienstes, Protokoll. Privilegiert: verwaltet die Rechte eines Mandanten, nie Plattformrollen"

care:
  # RFC-0071 §15 (Manifest 0.10): Nur Standardbibliothek, beim Bau wird nichts nachgeladen — ein Neubau ändert nur die Basis.
  rebuild: self

services:
  web:
    build: .
    port: 8000

# Wer die Seite SIEHT, regelt die Plattform (Rollen der Route, Sichtbarkeit
# der Instanz). Wer hier etwas AENDERN darf, regelt sie NICHT: die
# Plattformrolle tenant_admin wird Apps nie weitergegeben (oaap.core.identity
# 2.3), also kann die App sie nicht lesen. Jeder Aufruf nennt deshalb die
# Person, und der Identity-Dienst prueft sie selbst (oaap.core.authorization
# 0.3 §2.10). Wer kein Admin ist, sieht eine Seite, die das sagt.
routes:
  - path: /
    roles: [user]

# RFC-0118 §9: eine MCP-Tür mit Lesewerkzeugen (Personen, was eine Person
# darf, Rollen und Pakete, Zuordnungen) unter der Route /. Sie fragt den
# Identity-Dienst als die durchgereichte Person -- wer kein Mandanten-Admin
# ist, bekommt dieselbe Ablehnung wie auf der Seite.
mcp:
  path: /mcp

# RFC-0118 §9 / RFC-0094: die Hilfe für Mandanten-Admins.
docs:
  - product: rollen-rechte
    title: "Rollen & Rechte"
    path: docs/
    entry: index.md
    lang: de
    audience: [admin, user]
    readers: [admin]
    kinds:
      index.md: overview
      begriffe.md: concept
      rolle-anlegen.md: howto
      paket-zuordnen.md: howto
      gruppen.md: howto
      weitergaben.md: howto
      faq.md: faq

# Nichts Eigenes. Alles Wissen liegt im Identity-Dienst; diese App haelt
# keine Kopie. (Der Gesundheitspfad braucht kein Verzeichnis.)

# oaap.core.authorization 0.3: diese App erklaert keine Rechte -- sie
# VERWALTET die der anderen. `administer: true` ist die Bitte um den
# Verwaltungsschluessel; der Betreiber bestaetigt sie beim Installieren
# (--confirm-administer), sonst wird nichts gebaut.
authorization:
  administer: true

health:
  path: /healthz
