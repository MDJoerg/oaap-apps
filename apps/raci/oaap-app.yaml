oaap_manifest: "0.20"

app:
  id: raci
  name: Zuständigkeiten (RACI)
  version: 0.3.0
  type: native
  class: frontend
  description: "Festhalten, welche Kontaktperson für welche Firma verantwortlich ist -- im digitalen Zwilling, auf den Firmen der Partnerverwaltung"

care:
  # RFC-0071 §15 (Manifest 0.10): Nur Standardbibliothek, beim Bau wird nichts nachgeladen — ein Neubau ändert nur die Basis.
  rebuild: self

services:
  web:
    build: .
    port: 8000

routes:
  # deckt auch /mcp ab: das MCP-Gateway reicht die Person durch, die Tür
  # prüft wie die Seiten (RFC-0073, RFC-0118 §9)
  - path: /
    roles: [user]

mcp:
  path: /mcp
# RFC-0119 (Manifest 0.20): Vorlagen für Assistenten, die die App mitbringt. Der Knoten
# kopiert sie je Mandant wie die Doku; im Portal unter „Assistenten“ als Karte „von der App“.
assistant_templates:
  path: assistants/

# RFC-0031 SS5 / oaap.data.model 0.1 SS2.2 -- fast wortgleich mit dem
# RACI-Beispiel dort und in test_data_model.py's Fixtur, bis auf die
# OBJECT-TYPE-SCHLUESSEL selbst: RFC-0031 nennt sie 'Customer'/'Person',
# aber die sind auf oaap-test bereits permanent von 'app:model-live-
# check' belegt (Schritt 2s eigene Live-Probe, kein 'unregister' in
# oaap.data.model 0.1 -- siehe Partnerverwaltungs oaap-app.yaml). Diese
# App konsumiert deshalb 'Firma'/'Kontaktperson', Partnerverwaltungs
# eigene, dauerhafte Schluessel. 'responsible' und 'raci.assignments'
# sind RACIs EIGENE Typen (D1: "others attach their own group types")
# auf Firma, einem Objekttyp, den RACI weder besitzt noch veraendert.
data_model:
  relation_types:
    - key: responsible
      # title ist reine Anzeige (additiv); title_inverse bleibt wie registriert
      title: "ist verantwortlich für"
      title_inverse: "has responsible"
      from: Kontaktperson
      to: Firma
  group_types:
    - key: raci.assignments
      "on": Firma
      relations: [responsible]

contributes:
  - type: Firma
    role: contributor
    group: raci.assignments

consumes:
  - type: Firma
    as: Kunde
  # „Kontaktperson“, nicht „Mitarbeiter“ -- den Typ Mitarbeiter gibt es
  # (Mitarbeiterverwaltung), und er ist ein anderer (RFC-0118 §2)
  - type: Kontaktperson
    as: Kontaktperson
    fields: [reference, Email]

docs:
  # RFC-0094 / RFC-0118 §9: die Anwenderhilfe geht an die Hilfe des Mandanten
  # und damit auch an den Chat.
  - product: raci
    title: "Zuständigkeiten (RACI)"
    path: docs/
    entry: index.md
    lang: de
    audience: [user]
    readers: [end-user]
    kinds:
      index.md: overview
      verantwortung-zuweisen.md: howto
      luecken-finden.md: howto
      faq.md: faq

health:
  path: /healthz
  startup_grace_seconds: 10
