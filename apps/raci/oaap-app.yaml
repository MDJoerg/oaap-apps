oaap_manifest: "0.3"

app:
  id: raci
  name: OAAP RACI
  version: 0.1.1
  type: native
  class: frontend
  description: "Referenz-App fuer den digitalen Zwilling (RFC-0031 Schritt 4): liest Firma/Kontaktperson als Referenz, schreibt 'responsible' in raci.assignments"

services:
  web:
    build: .
    port: 8000

routes:
  - path: /
    roles: [user]

# RFC-0031 SS5 / oaap.data.model 0.1 SS2.2 -- fast wortgleich mit dem
# RACI-Beispiel dort und in test_data_model.py's Fixtur, bis auf die
# OBJECT-TYPE-SCHLUESSEL selbst: RFC-0031 nennt sie 'Customer'/'Person',
# aber die sind auf oaap-test bereits permanent von 'app:model-live-
# check' belegt (Schritt 2s eigene Live-Probe, kein 'unregister' in
# oaap.data.model 0.1 -- siehe Partnerverwaltungs oaap-app.yaml). Diese
# App konsumiert deshalb 'Firma'/'Kontaktperson', Partnerverwaltungs
# eigene, dauerhafte Schluessel. 'responsible' und 'raci.assignments'
# sind RACIs EIGENE Typen (D1: "others attach their own group types")
# auf Firma, einem Objekttyp, den RACI weder besitzt noch veraendert.
data_model:
  relation_types:
    - key: responsible
      title: "is responsible for"
      title_inverse: "has responsible"
      from: Kontaktperson
      to: Firma
  group_types:
    - key: raci.assignments
      "on": Firma
      relations: [responsible]

contributes:
  - type: Firma
    role: contributor
    group: raci.assignments

consumes:
  - type: Firma
    as: Kunde
  - type: Kontaktperson
    as: Mitarbeiter
    fields: [reference, Email]

health:
  path: /healthz
  startup_grace_seconds: 10
