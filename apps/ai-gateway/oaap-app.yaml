oaap_manifest: "0.18"

app:
  id: ai-gateway
  name: KI-Gateway
  version: 0.14.0
  type: native
  class: frontend
  description: "Eine Bezugsquelle für alle KI-Verbräuche: OpenAI-kompatibel, mit API-Schlüsseln, Modellnamen nach Zweck, Ampel je Bezugsquelle und Verbrauchsmessung ohne Inhalte. Freigaben für den Chat des Mandanten ohne Schlüssel, Kohorten für Schulungen, Eigenschaften je Modellname und Vorlagen für VS Code und opencode. Assistenten lesen Verbrauch und Modellnamen über die MCP-Tür."

care:
  # RFC-0071 §15 (Manifest 0.10): Nur Standardbibliothek, beim Bau wird nichts nachgeladen — ein Neubau ändert nur die Basis.
  rebuild: self

services:
  web:
    build: .
    port: 8000

routes:
  # Zwei Wege in dieselbe App. Der längere Pfad gewinnt (die Plattform
  # sortiert Routen nach Länge), also ist /v1 der Maschinen-Endpunkt und
  # alles andere die Betreiber-Sicht.
  #
  # /v1 ist `public`: Die Plattform authentifiziert hier NICHTS, entfernt
  # gefälschte Identitäts-Kopfzeilen und bremst je Client-Adresse
  # (RFC-0010 — einmal je Anfrage, ein Strom bleibt also unbelastet).
  # Geprüft wird im Dienst selbst: Der API-Schlüssel IST die Identität
  # (Spec §2). Das ist derselbe Bau wie Deploy-Hook und Flotten-Auskunft
  # und berührt die Vertragsregel „eine App baut nie einen Login" nicht —
  # die gilt für Oberflächen-Apps, und dies ist keine.
  - path: /v1
    roles: [public]
  # Die Betreiber-Sicht: Aliasse, Bezugsquellen, Schlüssel, Verbrauch,
  # Auswertung. Ausdrücklich `admin`: Wer Schlüssel ausstellt, vergibt Geld.
  # Darunter liegt auch /report/v1/… für externe Berichte (RFC-0064 §6):
  # Ein Abrechnungssystem fragt mit einem Plattform-API-Schlüssel eines
  # Maschinen-Benutzers mit Rolle admin (RFC-0027) — kein neuer Mechanismus.
  - path: /
    roles: [admin]

# RFC-0118 §9: die MCP-Tür unter der Route `/` -- also nur für admin, wie die
# Seite. Ein Assistent liest Verbrauch, Modellnamen und Bezugsquellen als die
# Person, die mit ihm spricht; nie einen Schlüssel oder Zugangsdaten.
mcp:
  path: /mcp

storage:
  # Schlüssel (nur als SHA-256), Messzeilen und Prüfspur. KEINE Inhalte:
  # Es gibt keine Spalte, in die ein Prompt passen würde (Spec §6).
  - name: data
    mount: /data

config:
  # Der Schlüssel zum Tresor der App (RFC-0064 D2). Seit 0.4 werden
  # Bezugsquellen und Modellnamen in der App gepflegt; die API-Keys der
  # Anbieter liegen dann verschlüsselt unter /data. Dieser Wert kommt
  # bewusst aus einer ANDEREN Quelle als /data, damit eine Sicherung von
  # /data allein sie nicht preisgibt. Wird er geändert, sind gespeicherte
  # Zugangsdaten nicht mehr lesbar und müssen neu eingetragen werden.
  - key: AIGW_MASTER_KEY
    label: "Tresorschlüssel für die Zugangsdaten der Anbieter (einmal erzeugen, danach nicht ändern)"
    secret: true
    generate: token
  # --- Die drei folgenden Variablen werden seit 0.4 nur noch EINMAL
  # gelesen: beim ersten Start übernimmt die App sie in ihre Datenbank,
  # danach wird auf der Betreiber-Seite gepflegt. Sie bleiben deklariert,
  # damit ein Update von 0.3 sie noch vorfindet.
  #
  # Bezugsquellen, eine je Zeile: `name=<adresse> [light=green|yellow|red]`
  # Die Ampel sagt, was mit den Daten geschehen kann — nicht, wo ein
  # Rechner steht: grün = verlassen das Unternehmen nicht; gelb = vielleicht,
  # aber unter verbindlicher Zusage; rot = externer Anbieter, Daten können
  # abfließen. Beispiel:
  #   ollama=http://oaap-app-<ollama-instanz>:11434/v1 light=green
  #   tsystems=https://<ai-business-hub>/v1 light=yellow
  #   groq=https://api.groq.com/openai/v1 light=red
  # Ohne Angabe gilt `red` — unbekannte Herkunft ist nicht souverän.
  # Eine Quelle auf demselben Knoten wird über eine App-zu-App-Verbindung
  # erreichbar (RFC-0016): `sudo oaap app link add <diese-instanz> <ollama>`.
  - key: AIGW_SUPPLIERS
    label: "Nur für die einmalige Übernahme (seit 0.4 in der App gepflegt): Bezugsquellen"
    multiline: true
    default: ""
  # Zugangsdaten je Bezugsquelle: `name=<schlüssel>`, eine je Zeile.
  # Geheim: wird nie zurückgezeigt und erscheint in keiner Antwort, keiner
  # Fehlermeldung und keiner Messzeile.
  - key: AIGW_SUPPLIER_KEYS
    label: "Nur für die einmalige Übernahme (seit 0.4 in der App gepflegt): Zugangsdaten"
    multiline: true
    secret: true
  # Aliasse nach ZWECK, eine je Zeile:
  #   chat-default = tsystems:llama-3.3-70b, groq:llama-3.3-70b-versatile
  #   embedding-default = ollama:nomic-embed-text
  # Die Liste ist die erklärte Ausweich-Gruppe; gewechselt wird nur
  # innerhalb. Vorzug hat grün vor gelb vor rot — wer die aufgeführte
  # Reihenfolge will, hängt `order=listed` an. Die Ampel eines Alias ist
  # die SCHLECHTESTE seiner Ziele: Wer von grün nach rot ausweichen kann,
  # ist nicht grün.
  - key: AIGW_ALIASES
    label: "Nur für die einmalige Übernahme (seit 0.4 in der App gepflegt): Aliasse"
    multiline: true
    default: ""
  # Wie lange auf ein Modell gewartet wird. Große Modelle mit langem
  # Kontext brauchen Minuten; zu kurz erzeugt Abbrüche, die wie ein
  # Fehler der Quelle aussehen, aber unsere Ungeduld sind.
  - key: AIGW_TIMEOUT_SECONDS
    label: "Geduld gegenüber der Bezugsquelle in Sekunden (10–3600)"
    default: "600"

destinations:
  # Seit 0.5.5 (oaap.net.destinations 0.3, `any: true`): Bezugsquellen,
  # die die PLATTFORM erreicht -- ein Gaming-PC hinter einem VPN-Client
  # (`through:`), das KI-Gateway eines inneren Knotens hinter dem Connector
  # (`via:`), ein Anbieter, dessen Schlüssel beim Betreiber bleibt. Beliebig
  # viele, jede unter ihrem eigenen Namen: Die App liest
  # OAAP_DESTINATION_<NAME>_URL und bietet sie unter „Bezugsquellen“ an. Die
  # Anmeldung ergänzt die Plattform; die App sieht den Schlüssel nie.
  - name: supplier
    kind: http
    any: true
    purpose: "Bezugsquellen über die Plattform (Tunnel, Connector, Anbieter)"

# Seit 0.7.0 (Manifest 0.15, RFC-0087 §8.2): Hier fragt der Knoten, welche
# Modellnamen und Bezugsquellen es gibt, wer wen nutzt, welche Quelle über
# welche Destination geht und wie es ihr zuletzt ging -- nur Namen und
# ok/down/idle, nie Adressen, Modellkennungen, Schlüssel oder Personen.
# Der Pfad liegt unter `/` und ist von außen damit nur für `admin` offen.
assets:
  path: /oaap/assets

# Seit 0.10.0 (Manifest 0.18, RFC-0104 §3.1): die Einrichtungstür. Der Knoten
# ruft sie beim Aufbau eines Profils (Schritt app.setup) über seinen internen
# Endpunkt mit OAAP_SETUP_KEY. Arten: supplier (ohne Zugangsdaten), alias,
# client. Der Pfad liegt unter `/` und ist von außen damit nur für `admin`
# offen -- und auch dort ohne den Schlüssel zu.
setup:
  path: /oaap/setup

# Seit 0.10.0 (RFC-0104 §4): Dieses Gateway steht in der Liste
# /platform/ai/gateways der Chats seines Mandanten; ein Chat ruft es über die
# via-Tür der Plattform ohne API-Schlüssel, berechtigt durch eine Freigabe
# der Art `client` (Reiter Schlüssel).
ai_gateway:
  serve: true

docs:
  # Die Hilfe des KI-Gateways geht an die Hilfe des Mandanten und damit auch an
  # den Chat. Sichtbar für dieselben Rollen, die die App betreten dürfen.
  - product: ai-gateway
    title: "KI-Gateway"
    path: docs/
    entry: index.md
    lang: de
    audience: [admin]
    readers: [admin]
    kinds:
      index.md: overview
      schluessel-ausstellen.md: howto
      bezugsquelle-anlegen.md: howto
      modellname-anlegen.md: howto
      kohorte-anlegen.md: howto
      verbrauch-auswerten.md: howto
      ampel.md: concept
      faq.md: faq

health:
  path: /healthz
  startup_grace_seconds: 15
