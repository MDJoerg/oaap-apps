oaap_manifest: "0.21"

app:
  id: vorgaenge
  name: Vorgänge
  version: 0.23.1
  type: native
  class: frontend
  description: "Melden und Klären im Mandanten: nimmt die Meldungen des Feedback-Knopfs der Plattform an (in jeder App, Herkunft vom Gateway beglaubigt) und interne Vorgänge; geklärt wird in Bereichen, die der Mandant hier oder in „Rollen & Rechte“ vergibt. Eine Instanz je Mandant. Der Knoten kündigt seinen Neustart hier als Vorgang an und schreibt die Anfragen der Mandanten an den Betreiber hierher. KI-Spezialisten (App Spezialisten) bearbeiten Vorgänge im Hintergrund: je Bereich eine Erstbearbeitung, interne Schritte, Stopp-Knopf; schreibende Aufrufe und Antworten an die Meldende nur nach Freigabe eines Menschen. Übersicht als Listenbericht mit Suche, Filtern, Sortieren und Blättern; MCP-Tür mit Suchen, Lesen, Melden und Kommentieren. Plattform ab 0.1.199"

care:
  # RFC-0071 §15 (Manifest 0.10): Nur Standardbibliothek, beim Bau wird nichts nachgeladen — ein Neubau ändert nur die Basis.
  rebuild: self

services:
  web:
    build: .
    port: 8000

# Wer die App öffnet, sieht seine eigenen Meldungen. Was er in einem
# Bereich tun darf, sagt die Erklärung unten, nicht die Plattformrolle.
# Die Meldungen des Knopfs kommen NICHT über diese Route, sondern über
# /platform/feedback auf dem Ursprung der meldenden App; das Gateway
# leitet sie unverändert hierher und setzt die Herkunft.
# 0.23.0 (RFC-0134 Stufe 3): der Leiter schließt Vorgänge aus einem Tor mit Beleg
# (Markierung „durch die Leitung“); Prüfmerkmal, Stichprobe und Prüfer je Bereich.
# 0.22.0 (RFC-0134 Stufe 2): Aufträge eines leitenden Spezialisten an andere
# Spezialisten (Einträge task/task_result, Unterstatus „wartet auf Auftrag“).
# 0.21.0 (RFC-0135 Stufe 1): Lieferungen durch ein Tor der Plattform kommen an
# /platform/cases/gate -- nur ueber den Block des Tors auf dem Ort des Mandanten
# (Plattform ab 0.1.383); kein neuer Eintrag im Manifest noetig.
# 0.20.0 (RFC-0127 Stufe 1.5, Manifest 0.21): Der Status eines Vorgangs, den
# das Backend einer App eröffnet hat, geht als adressiertes Ereignis an genau
# diese App zurück -- über die Tür der Plattform, nie an andere. Ein Knoten
# vor 0.21 überspringt den Block; dann gibt es keine Ereignisse.
events:
  publishes:
    - type: app.vorgaenge.case.statuschanged.v1
      title: "Vorgang hat den Status gewechselt"
      subject: case
      schema: events/case-statuschanged.json
      semantic_id: oaap-aas:Cases/1/0/StatusChanged
      audience: addressed

routes:
  - path: /
    roles: [admin, keyuser, user]

# RFC-0061 Q4: die Vorgänge liegen in der eigenen Ablage (SQLite), nicht
# im Zwilling -- der kann in 0.1 weder auflisten noch suchen.
# RFC-0073 (Manifest 0.11): die MCP-Tür unter der eigenen Route /. Ein MCP-Gateway
# desselben Mandanten findet sie in seiner Quellenliste; sie antwortet als die
# Person, die die Plattform durchreicht -- mit den Rechten der Seite.
mcp:
  path: /mcp
# RFC-0119 (Manifest 0.20): Vorlagen für Assistenten, die die App mitbringt. Der Knoten
# kopiert sie je Mandant wie die Doku; im Portal unter „Assistenten“ als Karte „von der App“.
assistant_templates:
  path: assistants/

storage:
  - name: data
    mount: /data

# RFC-0061 §2.1: ein Bereich (Queue) ist ein Kontext. Der Mandant legt in
# dieser App Bereiche an und vergibt sie in „Rollen & Rechte“ mit diesen
# Vorlagen; die Kennung des Bereichs ist der Kontext.
authorization:
  objects:
    - key: case
      title: Vorgang
      activities: [read, comment, triage, move, hand_over, close, vote]
      fields:
        - key: queue
          context: Zuständigkeitsbereich
  role_templates:
    - key: case_handler
      title: Bearbeiter/in
      grants:
        - object: case
          activities: [read, comment, triage, move, close]
          queue: $context
    - key: case_clearing
      title: Clearing
      grants:
        - object: case
          activities: [read, comment, triage, move, hand_over, close]
          queue: $context
    - key: case_voter
      title: Ideen bewerten
      grants:
        - object: case
          activities: [read, vote]

# RFC-0061 Q6: je Mandant einstellbar (eine Instanz je Mandant).
config:
  - key: VORGAENGE_RETENTION_MONTHS
    label: "Löschfrist: Monate nach Schließen/Ablehnen, bis die meldende Person aus dem Vorgang entfernt wird"
    default: "12"
  # RFC-0103 D11
  - key: VORGAENGE_ACCEPT_DAYS
    label: "Tage ohne Rückmeldung, nach denen sich ein beantworteter Vorgang von selbst schließt"
    default: "14"
  # RFC-0134 §5
  - key: VORGAENGE_TASKS_MAX
    label: "Aufträge eines leitenden Spezialisten je Vorgang (1-8; ein Leiter kann nur weniger einstellen)"
    default: "8"

# RFC-0094 / RFC-0118: die Hilfe der App -- an die Hilfe des Mandanten und an den Chat.
docs:
  - product: vorgaenge
    title: "Vorgänge"
    path: docs/
    entry: index.md
    lang: de
    audience: [admin, keyuser, user]
    readers: [end-user, power-user, admin]
    kinds:
      index.md: overview
      melden.md: howto
      bearbeiten.md: howto
      freigeben.md: howto
      bereiche-einrichten.md: howto
      partner.md: howto
      faq.md: faq

health:
  path: /healthz
  startup_grace_seconds: 10
