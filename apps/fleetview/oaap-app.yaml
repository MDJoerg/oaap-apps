oaap_manifest: "0.20"

app:
  id: fleetview
  name: Flotte
  version: 1.2.2
  type: native
  class: frontend
  description: "Die Flotte auf einen Blick — lesende Übersicht über Knoten, Versionen, Instanzen und Auffälligkeiten, aus dem Zwilling der Zentrale"

care:
  # RFC-0071 §15 (Manifest 0.10): Nur Standardbibliothek, beim Bau wird nichts nachgeladen — ein Neubau ändert nur die Basis.
  rebuild: self

# RFC-0085 §10: FleetView liest, was der Flottendienst der Zentrale in den
# Zwilling dieses Mandanten schreibt (Nachtrag A2). Die Bindung macht die
# Installation; sie stellt dabei den Maschinenschlüssel der Instanz aus
# (OAAP_PLATFORM_KEY, OAAP_TWIN_URL). Die Typen gibt es nur auf einer
# Zentrale, die `oaap fleet hub twin` gesetzt hat — anderswo verweigert
# die Installation die Bindung. In einem anderen Mandanten der Zentrale
# bleibt die Liste leer (jeder Mandant liest nur seinen Zwilling):
# FleetView gehört in den Mandanten, in den die Flotte schreibt (meist
# oaap-ops).
consumes:
  - type: FleetNode
  - type: FleetInstance

services:
  web:
    build: .
    port: 8000

routes:
  # RFC-0021 Entscheidung 3: sichtbar für server_admin und den
  # Dienstleister. `server_admin` wird nie an Apps durchgereicht
  # (RFC-0008) und jeder server_admin trägt in der Praxis auch `admin`
  # — deshalb steht hier admin. Die Rolle der Dienstleister, die die
  # Landschaft lesend betreuen, heißt seit RFC-0039 `support`.
  - path: /
    roles: [admin, support]

# RFC-0118 §9: eine MCP-Tür mit Lesewerkzeugen (Knoten, ein Knoten,
# Instanzen) unter der Route / -- also für dieselben Rollen wie die Seite.
mcp:
  path: /mcp
# RFC-0119 (Manifest 0.20): Vorlagen für Assistenten, die die App mitbringt. Der Knoten
# kopiert sie je Mandant wie die Doku; im Portal unter „Assistenten“ als Karte „von der App“.
assistant_templates:
  path: assistants/

# RFC-0118 §9 / RFC-0094: die Hilfe für Betreiber und Dienstleister.
docs:
  - product: fleetview
    title: "Flotte"
    path: docs/
    entry: index.md
    lang: de
    audience: [admin, support]
    readers: [admin, operator]
    kinds:
      index.md: overview
      flotte-pruefen.md: howto
      knoten-ansehen.md: howto
      instanz-finden.md: howto
      einrichten.md: howto
      faq.md: faq

storage:
  # Nur der zuletzt gelesene Stand (fleet-state.json) — damit ein nicht
  # lesbarer Zwilling den letzten Stand zeigt statt einer leeren Seite.
  # KEIN Schlüssel: der lebt ausschließlich in der Umgebung der Instanz.
  - name: data
    mount: /data

config:
  # Lesetakt. RFC-0021 Entscheidung 2: Minutenbereich — alarmiert wird
  # von der Zentrale (RFC-0080), nicht von FleetView.
  - key: FLEETVIEW_POLL_SECONDS
    label: "Lesetakt in Sekunden (30–3600)"
    default: "60"

health:
  path: /healthz
  startup_grace_seconds: 30
