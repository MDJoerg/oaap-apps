oaap_manifest: "0.10"

app:
  id: marketplace
  name: Marketplace
  version: 0.3.0
  type: native
  class: frontend
  description: "Digitale Assets mit Kanälen (stable, beta), Sichtbarkeit und Berechtigungen (RFC-0077 Stufen 1 und 2): Schaufenster mit Landschaften, Kategorien, Suche und Detailseite (ObjectPage, Teilen mit QR-Code). Asset-Typen OAAP-App, Aufbau-Vorlage und Datei, Texte je Sprache. Eine Sperre prüft vor jedem Speichern auf Geheimnisse; mit Review zählt ein Release erst nach der Freigabe durch einen zweiten Prinzipal (z. B. eine Prüf-KI). Paketkataloge der Knoten ziehen OAAP-Apps im Spiegelmodus über einen Feed."

care:
  # RFC-0071 §15 (Manifest 0.10): PyYAML fest auf 6.0.3, Debians Korrekturen per
  # apt-get upgrade (§16) -- ein Neubau ändert nur die Basis.
  rebuild: self

services:
  web:
    build: .
    port: 8000

routes:
  # Der längere Pfad gewinnt. Die App prüft jede Antwort noch einmal mit
  # access.py -- verborgen heißt 404, nie 403 (RFC-0077 §5).
  - path: /admin
    roles: [admin]
  # Angemeldet: dieselben Seiten mit Identität (eine öffentliche Route kennt keine).
  - path: /my
    roles: [user, admin]
  # Suche, Details, Einchecken (Sitzung oder API-Schlüssel eines Maschinenbenutzers).
  - path: /api/v1
    roles: [user, admin]
  # Empfänger, z. B. ein Paketkatalog im Spiegelmodus (Maschinenbenutzer, D10).
  - path: /feed/v1
    roles: [user, admin]
  # Öffentlich: was `anyone` sehen darf. Die Plattform bremst je Adresse (RFC-0010).
  - path: /
    roles: [public]

storage:
  # market.db (SQLite, WAL) und blobs/ -- im Backup des Knotens (D9).
  - name: data
    mount: /data

config:
  - key: MARKET_NAME
    label: "Name im Kopf der Seiten und im Feed"
    default: "Marketplace"
  - key: MARKET_MAX_FILE_MB
    label: "Größte Datei in MB (ein Paketkatalog nimmt höchstens 256 MB an)"
    default: "256"
  - key: MARKET_CHANNELS
    label: "Kanäle, kommagetrennt (global für alle Assets, D12)"
    default: "stable,beta"
  - key: MARKET_TYPES
    label: "Eingeschaltete Asset-Typen: oaap-app, oaap-profile (Aufbau-Vorlage), file"
    default: "oaap-app,oaap-profile,file"
  - key: MARKET_FILE_EXTENSIONS
    label: "Erlaubte Endungen für den Typ file"
    default: "zip,pdf,png,jpg,txt,md,json"
  # RFC-0077 §15.8.5: vier Augen. on = ein neues Release zählt erst nach der Freigabe
  # durch einen Prüfer (nicht den Einsteller); Eskalationen entscheidet der Betreiber.
  - key: MARKET_REVIEW
    label: "Review: on = Releases erst nach Freigabe durch einen Prüfer (vier Augen); off = sofort"
    default: "off"
  - key: MARKET_REVIEW_ESCALATE_HOURS
    label: "Review: nach so vielen Stunden ohne Urteil gilt ein Fall als eskaliert"
    default: "24"
  - key: MARKET_DEFAULT_LANG
    label: "Basissprache der Inhalte (en empfohlen)"
    default: "en"
  - key: MARKET_PUBLIC_URL
    label: "Öffentliche Adresse für Teilen-Links und den Feed (leer = aus der Anfrage), z. B. https://market.example"
    default: ""

health:
  path: /healthz
  startup_grace_seconds: 15

launchpad:
  group: Werkzeuge
