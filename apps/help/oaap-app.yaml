oaap_manifest: "0.18"

app:
  id: help
  name: OAAP-Hilfe
  version: 0.7.0
  type: native
  class: frontend
  description: "Die Dokumentation eines Mandanten für Menschen und jede KI (RFC-0078, RFC-0094 Stufe 1). Seit 0.7.0 mit Einrichtungstür /oaap/setup (RFC-0104): der Aufbau aus einem Profil holt die Doku ohne Handgriff (Art fetch). Seit 0.6.0 ein Treffer je Dokument (weitere Abschnitte darunter) und ein Hinweis, wenn die Plattform-Doku fehlt (Destination docs-origin). Seit 0.5.0 mit klickbaren Links auf die eigene Leseseite in help_search und help_read: die Doku der installierten Apps als Hilfsprodukte (der Knoten reicht sie herein, sobald eine App sie im Manifest erklärt), dazu die OAAP-Doku samt CLI-Referenz (abschaltbar). Startseite mit Kacheln je Produkt, Suche mit Filtern nach Produkt und Dokumenttyp, Lese-API und MCP (help_search, help_read, help_topics, help_products, Prompts guide/cli); im Chat des eigenen Mandanten ohne Freigabeschritt (MCP-Gateway ab 0.11.0). Keine eigene KI."

care:
  # RFC-0071 §15 (Manifest 0.10): Nur Standardbibliothek, beim Bau wird nichts nachgeladen.
  rebuild: self

services:
  web:
    build: .
    port: 8000

routes:
  # Der längere Pfad gewinnt. Die Verwaltung (Abruf, eigene Notizen) nur für admin.
  - path: /admin
    roles: [admin]
  # Zentrale Instanz (RFC-0078 D8, O3): dieselben Türen öffentlich und
  # ungefiltert -- die App antwortet hier nur mit HELP_PUBLIC=on, sonst 404.
  # Die Plattform bremst je Client-Adresse (RFC-0010).
  - path: /public
    roles: [public]
  # Die Bearbeitungstür (RFC-0078 §15.3, D16): Anfragen nach Anleitungen lesen
  # und schließen. `public`, weil die App selbst prüft: ein Schlüssel, dessen
  # SHA-256 in HELP_MAINT_KEY_SHA256 steht -- ohne ihn 401, nie Daten.
  - path: /maint
    roles: [public]
  # Die Einrichtungstür (RFC-0104 §3.1): von außen nur für admin erreichbar,
  # und auch dann ohne den Einrichtungsschlüssel der Instanz (OAAP_SETUP_KEY)
  # 403. Der Knoten ruft sie über den internen Zuhörer des Gateways.
  - path: /oaap
    roles: [admin]
  # Angemeldet: Seite, API und MCP-Tür mit dem Zielgruppenfilter nach den
  # Rollen der Person (D5: Relevanz, keine Geheimhaltung). Über das
  # MCP-Gateway des Mandanten erreicht eine KI die Tür als diese Person.
  # In Routen stehen nur App-Rollen; server_admin und tenant_admin kommen über
  # admin herein, X-OAAP-Roles trägt trotzdem alle ihre Rollen (identity 2.1).
  - path: /
    roles: [admin, keyuser, user, support]

# RFC-0073 (Manifest 0.11): die MCP-Tür unter der eigenen Route. Auf der
# zentralen Instanz erreicht sie ein Client auch direkt.
mcp:
  path: /mcp

# RFC-0094 (Manifest 0.17): die Doku der installierten Apps DIESES Mandanten,
# lesend unter /oaap/docs, vom Knoten bei jeder Installation, jedem Update und
# jedem Entfernen nachgeführt. Nie die eines anderen Mandanten.
docs_sources:
  read: true

# RFC-0104 (Manifest 0.18): die Einrichtungstür. Art `fetch`, id `docs`:
# die Plattform-Doku jetzt holen (wie „Jetzt holen“ auf /admin).
setup:
  path: /oaap/setup

destinations:
  - name: docs-origin
    kind: http
    purpose: "Archiv des Doku-Repositorys (tar.gz), z. B. https://codeload.github.com/MDJoerg/oaap-docs"

storage:
  # Index (SQLite), zuletzt angenommenes Archiv, Abrufzustand, eigene Notizen.
  - name: data
    mount: /data

config:
  - key: HELP_TITLE
    label: "Titel der Hilfe (Kopfzeile und Startseite)"
    default: "Hilfe"
  - key: HELP_LAYOUT
    label: "Startseite: kacheln (eine Kachel je Hilfsprodukt) oder nüchtern (Liste)"
    default: "kacheln"
  - key: HELP_OAAP_DOCS
    label: "OAAP-Plattform-Doku einbeziehen (on/off) -- off: nur die Doku der Apps und eigene Notizen; die Destination docs-origin wird dann nicht gebraucht"
    default: "on"
  - key: HELP_ARCHIVE_PATH
    label: "Pfad des Archivs hinter der Destination docs-origin (GitHub codeload: /tar.gz/refs/heads/main; Forgejo: /archive/main.tar.gz)"
    default: "/tar.gz/refs/heads/main"
  - key: HELP_WEB_TEMPLATE
    label: "Vorlage für Links zum Original, {path} = Pfad im Repository, z. B. https://github.com/MDJoerg/oaap-docs/blob/main/{path} (leer = keine Links)"
    default: ""
  - key: HELP_FETCH_HOURS
    label: "Abstand der Abrufe in Stunden"
    default: "6"
  - key: HELP_REQUESTS
    label: "Anfragen nach fehlenden Anleitungen (on/off): die suchende KI bekommt help_request_guide; gleiche Anfragen werden Stimmen, gespeichert ohne Adresse und Identität (RFC-0078 §15)"
    default: "off"
  - key: HELP_MAINT_KEY_SHA256
    label: "SHA-256 (hex) des Schlüssels für die Bearbeitungstür /maint/mcp -- nur der Digest, nie der Schlüssel; leer = Tür zu"
    default: ""
  - key: HELP_PUBLIC
    label: "Öffentlicher Pfad /public/ (on/off): nur für eine zentrale Instanz -- dort antworten Seite, API und MCP ohne Anmeldung und ohne Zielgruppenfilter"
    default: "off"

health:
  path: /healthz
  startup_grace_seconds: 10
