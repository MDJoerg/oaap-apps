oaap_manifest: "0.11"

app:
  id: help
  name: OAAP-Hilfe
  version: 0.2.0
  type: native
  class: frontend
  description: "Statisches Hilfewissen für jede KI (RFC-0078 Stufen 1+2): die OAAP-Dokumentation samt erzeugter CLI-Referenz als Volltextindex, über MCP (help_search, help_read, help_topics, Prompts guide/cli), eine Lese-API und eine Such- und Leseseite. Holt die Doku über die Destination docs-origin, ohne Neuausrollen; keine eigene KI, kein Zustand des Knotens."

care:
  # RFC-0071 §15 (Manifest 0.10): Nur Standardbibliothek, beim Bau wird nichts nachgeladen.
  rebuild: self

services:
  web:
    build: .
    port: 8000

routes:
  # Der längere Pfad gewinnt. Die Verwaltung (Abruf, eigene Notizen) nur für admin.
  - path: /admin
    roles: [admin]
  # Zentrale Instanz (RFC-0078 D8, O3): dieselben Türen öffentlich und
  # ungefiltert -- die App antwortet hier nur mit HELP_PUBLIC=on, sonst 404.
  # Die Plattform bremst je Client-Adresse (RFC-0010).
  - path: /public
    roles: [public]
  # Angemeldet: Seite, API und MCP-Tür mit dem Zielgruppenfilter nach den
  # Rollen der Person (D5: Relevanz, keine Geheimhaltung). Über das
  # MCP-Gateway des Mandanten erreicht eine KI die Tür als diese Person.
  # In Routen stehen nur App-Rollen; server_admin und tenant_admin kommen über
  # admin herein, X-OAAP-Roles trägt trotzdem alle ihre Rollen (identity 2.1).
  - path: /
    roles: [admin, keyuser, user, support]

# RFC-0073 (Manifest 0.11): die MCP-Tür unter der eigenen Route. Auf der
# zentralen Instanz erreicht sie ein Client auch direkt.
mcp:
  path: /mcp

destinations:
  - name: docs-origin
    kind: http
    purpose: "Archiv des Doku-Repositorys (tar.gz), z. B. https://codeload.github.com/MDJoerg/oaap-docs"

storage:
  # Index (SQLite), zuletzt angenommenes Archiv, Abrufzustand, eigene Notizen.
  - name: data
    mount: /data

config:
  - key: HELP_ARCHIVE_PATH
    label: "Pfad des Archivs hinter der Destination docs-origin (GitHub codeload: /tar.gz/refs/heads/main; Forgejo: /archive/main.tar.gz)"
    default: "/tar.gz/refs/heads/main"
  - key: HELP_WEB_TEMPLATE
    label: "Vorlage für Links zum Original, {path} = Pfad im Repository, z. B. https://github.com/MDJoerg/oaap-docs/blob/main/{path} (leer = keine Links)"
    default: ""
  - key: HELP_FETCH_HOURS
    label: "Abstand der Abrufe in Stunden"
    default: "6"
  - key: HELP_PUBLIC
    label: "Öffentlicher Pfad /public/ (on/off): nur für eine zentrale Instanz -- dort antworten Seite, API und MCP ohne Anmeldung und ohne Zielgruppenfilter"
    default: "off"

health:
  path: /healthz
  startup_grace_seconds: 10
