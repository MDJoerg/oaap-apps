oaap_manifest: "0.10"

app:
  id: keycloak
  name: Keycloak (Anmeldedienst)
  version: 0.1.6
  type: wrapped
  # Kein Startfeld-Kachel: Keycloak hat zwar eine Oberfläche, aber es ist
  # keine App, die jemand "benutzt" — es ist die Tür, durch die andere
  # Apps betreten werden. `service` hält es aus dem Startfeld heraus
  # (Runtime 2.10); der Betreiber erreicht die Verwaltung über die
  # Instanzseite.
  class: service
  description: "Identitätsanbieter (OIDC) für OAAP-Mandanten — ein Realm je Mandant (RFC-0041). OAAP wird OIDC-Client, die Apps sehen den Anbieter nie: sie bekommen weiterhin nur die X-OAAP-*-Kopfzeilen. Version festgenagelt auf 26.7.4, weil OAAP Realms über die Verwaltungsschnittstelle anlegt und so eine Anbindung unsichtbar gegen ein fremdes Produkt altert."

# Mehr-Container (RFC-0016): der Server und seine Datenbank. `db` bekommt
# KEINE Route und KEINEN Endpunkt, ist also von außen und von anderen
# Apps nie erreichbar — sie findet sich über den Dienstnamen auf dem
# privaten Instanznetz.
#
# Ausdrücklich NICHT das Plattform-Postgres (oaap.data.store): Dieses RFC
# darf einen Knoten nicht dazu zwingen, das Profil `store` zu tragen —
# oaapx01 trägt es nicht (RFC-0041 K2).
care:
  # RFC-0071 §15 (Manifest 0.10): Die Basis ist auf eine Version festgenagelt, beim Bau wird nichts nachgeladen — ein Neubau holt nur denselben Stand neu.
  rebuild: self

services:
  keycloak:
    build: .
    port: 8080
  db:
    image: postgres:16-alpine
    port: 5432

storage:
  # Die Identitäten des Vereins. Das ist der Grund, warum diese App eine
  # gewöhnliche OAAP-App ist: Sicherung, Rückspielen und Generalprobe
  # gelten hier wie überall.
  - name: db
    mount: /var/lib/postgresql/data
    service: db

# `public`, und das ist keine Nachlässigkeit: Keycloak IST die Anmeldung.
# Es hinter die Anmeldung des Gateways zu stellen wäre eine Tür, die sich
# selbst als Schlüssel verlangt. Die Verwaltungsoberfläche schützt
# Keycloak mit seinem eigenen Admin-Login; die Mengenbremse (RFC-0010)
# greift weiterhin.
#
# 0.1.6: Die VERWALTUNGSOBERFLÄCHE liegt hinter der OAAP-Anmeldung. Gemessen
# am 07.11. auf oaap-test: eine Stunde, nachdem der Knoten einen
# öffentlichen Namen bekam, öffneten fremde Scanner /admin/master/console/.
# Keycloaks eigener Login hielt — aber eine Tür, die niemand von außen
# braucht, muss nicht von außen zu sehen sein.
#
# „Nur aus dem LAN“ geht NICHT: Konnektor (`oaap idp`) und MCP-Gateway
# sprechen Keycloak über die öffentliche Adresse an (sie ist der issuer),
# kommen also über den Router zurück und tragen dieselbe Absender-IP wie
# ein Fremder. Deshalb eine Rolle statt einer Adresse.
#
# Offen bleiben — längster Pfad gewinnt:
#   /admin/realms, /admin/serverinfo  die Verwaltungs-SCHNITTSTELLE, die der
#                                     Konnektor benutzt; sie verlangt ein
#                                     Keycloak-Token, sonst 401
#   /realms/<realm>/...               jede Anmeldung eines Mandanten, auch
#                                     die von Claude Code; der Token-
#                                     Endpunkt von master (Konnektor)
# Hinter der Anmeldung (`admin` des Mandanten der Instanz; server_admin
# kommt über die Mandantengrenze, darf aber im Manifest nicht stehen,
# RFC-0008):
#   /admin                            jede Verwaltungsoberfläche
#                                     (/admin/<realm>/console)
#   /realms/master/protocol/openid-connect/auth, /realms/master/login-actions,
#   /realms/master/account            die Browser-Anmeldung des
#                                     Verwalter-Realms
routes:
  - path: /
    roles: [public]
    service: keycloak
  - path: /admin
    roles: [admin]
    service: keycloak
  - path: /admin/realms
    roles: [public]
    service: keycloak
  - path: /admin/serverinfo
    roles: [public]
    service: keycloak
  - path: /realms/master/protocol/openid-connect/auth
    roles: [admin]
    service: keycloak
  - path: /realms/master/login-actions
    roles: [admin]
    service: keycloak
  - path: /realms/master/account
    roles: [admin]
    service: keycloak

config:
  # Die öffentliche Adresse DIESER Instanz. Keycloak schreibt sie als
  # `issuer` in jedes Token, und OAAP bindet die Benutzer daran
  # (RFC-0041 K4). Ohne sie startet der Container absichtlich nicht.
  - key: KC_HOSTNAME
    label: "Öffentliche Adresse dieser Instanz, z. B. https://auth.example.org (Pflicht — steht als 'issuer' in jedem Token)"
  # Ein Geheimnis, das der Betreiber nie selbst wählen muss. Es wird von
  # BEIDEN Containern gelesen: postgres richtet damit seinen Benutzer
  # ein, der Entrypoint von Keycloak gibt es als KC_DB_PASSWORD weiter.
  # Eine Angabe statt zweier, die auseinanderlaufen könnten.
  - key: POSTGRES_PASSWORD
    label: "Datenbank-Geheimnis (wird erzeugt; Keycloak und Postgres benutzen dasselbe)"
    secret: true
    generate: token
  # Der erste Verwalter. Keycloak legt ihn beim ALLERERSTEN Start an und
  # ignoriert die Werte danach; das Passwort wird in der
  # Verwaltungsoberfläche geändert.
  - key: KC_BOOTSTRAP_ADMIN_USERNAME
    label: "Erster Keycloak-Verwalter (nur beim allerersten Start)"
    default: "admin"
  - key: KC_BOOTSTRAP_ADMIN_PASSWORD
    label: "Passwort dieses Verwalters (nur beim allerersten Start; danach in Keycloak ändern)"
    secret: true
    generate: token

health:
  # Kein `service`: Die Gesundheitsprüfung hängt am PRIMÄREN Dienst
  # (Runtime 2.12 — der, der `/` bedient), hier also an keycloak.
  #
  # Genau das Dokument, das ein OIDC-Client als erstes abholt. Eine
  # Prüfung, die dasselbe fragt wie der echte Abnehmer, ist mehr wert
  # als eine, die nur "der Port ist offen" sagt.
  path: /realms/master/.well-known/openid-configuration
  startup_grace_seconds: 120
